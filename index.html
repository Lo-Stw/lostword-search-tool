<style>

body{

header{

.container{

.tabs{

.hidden{

.loading{

.result-count{

.result{

.char{

.muted{

}

.tag{

}

.attr{
 background:#fff1b8
}

.bullet{
 background:#dceeff

.attack{
 background:#f6f6f6;

 padding:9px;

.attack h4{

.editor{

.editor h3{

.special-grid{
 display:grid;
 grid-template-columns:1fr 1fr;

.special-row{
 background:white;

 padding:6px
}

.special-head{
 display:flex;
 align-items:center;

}

.special-head b{

}

.special-head button{

.special-detail{

.switch{

.msg{

@media(max-width:600px){

<script>

/* =====================================================
   Supabase
===================================================== */

const URL="https://tuzeswyyprzudnznalue.supabase.co";
const KEY="sb_publishable_Zt-pb9JvdQC9lOUTAM6x0Q_fTq1hU-W";
const TABLE="characters";

/* =====================================================
   基本データ
===================================================== */

const TYPES=[
"攻撃式","技巧式","速攻式","破壊式",
"防御式","支援式","回復式","妨害式"
];

const ATTR=[
"日","月","火","水","木","金","土","星"
];

const BULLETS=[
"通常弾",
"光弾",
"レーザー弾",
"質量弾",
"エネルギー弾",
"流体弾",
"尖弾",
"御札弾",
"斬撃弾",
"肉弾",
"ミサイル弾"
];

const RANGES=["全体","単体"];

const ATTACKS=[
["spread","拡散ショット"],
["focus","集中ショット"],
["spell1","スペルカード1"],
["spell2","スペルカード2"],
["lastWord","ラストワード"]
];

const SPECIALS=[
"硬質弾",
"斬裂弾",
"貫通弾",
"必中弾",
"鏡面弾",
"弾性弾",
"爆破弾",
"特効弾",
"粘着弾",
"衝撃弾",
"吸収弾",
"反動弾",
"焼却弾",
"氷解弾",
"放電弾",
"過毒弾",
"閃光弾"
];

const CHANGE_TRAITS=[
"アタック連携",
"ガード連携",
"スピード連携",
"パワー連携",
"シールド連携",
"バイタル連携"
];

const STAT_BUFFS=[
"速力","陽攻","陰攻","陽防","陰防"
];

/* =====================================================
   特殊スキル一覧
===================================================== */

const SPECIAL_SKILLS=[
"禁止解除",
"有利属性ダメージアップ",
"不利属性ダメージアップ",
"属性強化",
"弾強化",
"弱点付与",
"団結",
"バディコネクト",
"ゾーン",
"スキル再使用ターン数短縮",
"大結界",
"逆相",
"スペルゲージ遅延",
"全体耐性ダウン",
"RANKⅡバフ",
"RANKⅡデバフ",
"畜力",
"共鳴",
"持続",
"蓄積",
"ブースト使用時バフ",
"グレイズ使用時バフ"
];

/* =====================================================
   データ
===================================================== */

let data=[];
let mode="AND";
let statMode="";

const selected={
 type:[],
 attack:[],
 range:[],
 attr:[],
 bullet:[],
 special:[],
 char:[]
};

const attackData={};

ATTACKS.forEach(([key])=>{
 attackData[key]={
  name:"",
  range:"全体",
  attributes:[],
  bulletTypes:[],
  specials:{},
  specialValues:{}
 };

 SPECIALS.forEach(x=>{
  attackData[key].specials[x]=false;
  attackData[key].specialValues[x]="";
 });
});

let specialData={};

SPECIAL_SKILLS.forEach(x=>{
 specialData[x]={
  enabled:false
 };
});

let abilities={
 conversion:[],
 immunity:[],
 damageReduce:[],
 powerUp:[]
};

let changeTraits=[];

/* =====================================================
   共通
===================================================== */

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function num(id){
 const v=document.getElementById(id).value;
 return v===""?null:Number(v);
}

/* =====================================================
   チップ
===================================================== */

function chips(id,arr,sel,fn){

 const e=document.getElementById(id);

 if(!e)return;

 e.innerHTML="";

 arr.forEach(x=>{

  const b=document.createElement("button");

  b.className=
   "filter"+
   (sel.includes(x)?" selected":"");

  b.textContent=x;

  b.onclick=()=>{
   fn(x,b);
  };

  e.appendChild(b);

 });
}

function toggle(arr,x,b){

 const i=arr.indexOf(x);

 if(i>=0){
  arr.splice(i,1);
  b.classList.remove("selected");
 }else{
  arr.push(x);
  b.classList.add("selected");
 }

 search();
}

/* =====================================================
   検索フィルター
===================================================== */

function buildFilters(){

 chips(
  "fType",
  TYPES,
  selected.type,
  (x,b)=>toggle(selected.type,x,b)
 );

 chips(
  "fAttack",
  ATTACKS.map(x=>x[1]),
  selected.attack,
  (x,b)=>toggle(selected.attack,x,b)
 );

 chips(
  "fRange",
  RANGES,
  selected.range,
  (x,b)=>toggle(selected.range,x,b)
 );

 chips(
  "fAttr",
  ATTR,
  selected.attr,
  (x,b)=>toggle(selected.attr,x,b)
 );

 chips(
  "fBullet",
  BULLETS,
  selected.bullet,
  (x,b)=>toggle(selected.bullet,x,b)
 );

 chips(
  "fSpecial",
  SPECIALS,
  selected.special,
  (x,b)=>toggle(selected.special,x,b)
 );

 chips(
  "fChar",
  SPECIAL_SKILLS,
  selected.char,
  (x,b)=>toggle(selected.char,x,b)
 );

}

/* =====================================================
   特殊弾
===================================================== */

function buildSpecialControls(key){

 const a=attackData[key];

 const e=document.getElementById("as-"+key);

 e.innerHTML="";

 SPECIALS.forEach(x=>{

  const row=document.createElement("div");

  row.className="special-row";

  const enabled=a.specials[x];

  row.innerHTML=`
   <div class="special-head">

    <b>${x}</b>

    <button
      type="button"
      class="${enabled?"on":""}">
      ${enabled?"あり":"なし"}
    </button>

   </div>

   <div class="special-detail ${enabled?"show":""}">
   </div>
  `;

  e.appendChild(row);

  const btn=row.querySelector("button");

  const detail=row.querySelector(".special-detail");

  btn.onclick=()=>{

   a.specials[x]=!a.specials[x];

   btn.classList.toggle(
    "on",
    a.specials[x]
   );

   btn.textContent=
    a.specials[x]?"あり":"なし";

   detail.classList.toggle(
    "show",
    a.specials[x]
   );

  };

  /*
   * 特殊弾ごとの数値
   */

  if(
   x==="硬質弾" ||
   x==="斬裂弾" ||
   x==="吸収弾" ||
   x==="反動弾"
  ){

   detail.innerHTML=`
    <input
     class="input"
     type="number"
     placeholder="倍率"
     value="${esc(a.specialValues[x])}">
   `;

  }
  else if(
   x==="粘着弾" ||
   x==="衝撃弾"
  ){

   detail.innerHTML=`
    <input
     class="input"
     type="number"
     placeholder="発動率 %"
     value="${esc(a.specialValues[x])}">
   `;

  }

  /*
   * その他は入力欄なし
   */

  const input=detail.querySelector("input");

  if(input){

   input.oninput=()=>{
    a.specialValues[x]=input.value;
   };

  }

 });

}

/* =====================================================
   攻撃編集
===================================================== */

function initEditors(){

 const e=document.getElementById("attackEditors");

 e.innerHTML="";

 ATTACKS.forEach(([key,label])=>{

  const a=attackData[key];

  const d=document.createElement("div");

  d.className="editor";

  d.innerHTML=`

   <h3>${label}</h3>

   <div class="section">

    <div class="mini">名前</div>

    <input
     class="input"
     data-k="${key}"
     data-p="name"
     value="${esc(a.name)}">

   </div>

   <div class="section">

    <div class="mini">全体・単体</div>

    <select
     class="select"
     data-k="${key}"
     data-p="range">

     <option ${a.range==="全体"?"selected":""}>
      全体
     </option>

     <option ${a.range==="単体"?"selected":""}>
      単体
     </option>

    </select>

   </div>

   <div class="section">

    <div class="mini">属性</div>

    <div id="aa-${key}" class="buttons"></div>

   </div>

   <div class="section">

    <div class="mini">弾種</div>

    <div id="ab-${key}" class="buttons"></div>

   </div>

   <div class="section">

    <div class="mini">特殊弾</div>

    <div
     id="as-${key}"
     class="special-grid">
    </div>

   </div>

  `;

  e.appendChild(d);

  chips(
   "aa-"+key,
   ATTR,
   a.attributes,
   (x,b)=>{

    const i=a.attributes.indexOf(x);

    if(i>=0){
     a.attributes.splice(i,1);
     b.classList.remove("selected");
    }else{
     a.attributes.push(x);
     b.classList.add("selected");
    }

   }
  );

  buildBulletControls(key);

  buildSpecialControls(key);

 });

 document
 .querySelectorAll("[data-p]")
 .forEach(el=>{

  el.oninput=()=>{

   attackData[
    el.dataset.k
   ][el.dataset.p]=el.value;

  };

 });

}

/* =====================================================
   弾種
===================================================== */

function buildBulletControls(key){

 const a=attackData[key];

 const e=document.getElementById(
  "ab-"+key
 );

 e.innerHTML="";

 BULLETS.forEach(x=>{

  const b=document.createElement("button");

  const yes=
   a.bulletTypes.includes(x);

  b.className=
   "filter"+
   (yes?" selected":"");

  b.textContent=
   x+"："+(yes?"あり":"なし");

  b.onclick=()=>{

   const i=a.bulletTypes.indexOf(x);

   if(i>=0){
    a.bulletTypes.splice(i,1);
   }else{
    a.bulletTypes.push(x);
   }

   const now=
    a.bulletTypes.includes(x);

   b.classList.toggle(
    "selected",
    now
   );

   b.textContent=
    x+"："+(now?"あり":"なし");

  };

  e.appendChild(b);

 });

}

/* =====================================================
   特殊スキルUI
===================================================== */

function switchButton(
 container,
 key,
 label,
 extra=""
){

 const box=document.createElement("div");

 box.className="group";

 box.innerHTML=`

  <div class="switch">

   <button
    id="skill-${key}">
    ${label}：なし
   </button>

  </div>

  <div id="detail-${key}">
   ${extra}
  </div>

 `;

 container.appendChild(box);

 const btn=box.querySelector("button");

 const detail=
  box.querySelector(
   "#detail-"+key
  );

 btn.onclick=()=>{

  specialData[key].enabled=
   !specialData[key].enabled;

  const on=
   specialData[key].enabled;

  btn.classList.toggle(
   "on",
   on
  );

  btn.textContent=
   label+"："+(on?"あり":"なし");

  detail.style.display=
   on?"block":"none";

 };

 detail.style.display="none";

 return detail;
}

/* =====================================================
   特殊スキル
===================================================== */

function initSpecialSkills(){

 const e=
  document.getElementById(
   "specialSkills"
  );

 e.innerHTML="";

 /* 禁止解除 */

 let d=switchButton(
  e,
  "禁止解除",
  "禁止解除"
 );

 d.innerHTML=`
  <input
   class="input"
   type="number"
   placeholder="解除数">
 `;

 d.querySelector("input").oninput=

/* =====================================================
   検索
===================================================== */

function attackValues(c){
 return Object.values(c.attacks||{});
}

function flatSpecials(c){

 const out=[];

 attackValues(c).forEach(a=>{

  Object.keys(
   a.specials||{}
  ).forEach(k=>{

   if(a.specials[k]){
    out.push(k);
   }

  });

 });

 return [...new Set(out)];
}

function hasChar(c,x){

 const d=c.details||{};

 const s=d.specialSkills||{};

 return !!(
  s[x]?.enabled ||
  d[x]
 );

}

function matchSelected(
 sel,
 vals
){

 if(!sel.length)return true;

 return mode==="AND"
  ?sel.every(x=>vals.includes(x))
  :sel.some(x=>vals.includes(x));

}

function search(){

 const q=
  document.getElementById("q")
  .value
  .trim()
  .toLowerCase();

 const qs=
  document.getElementById("qSymbol")
  .value
  .trim()
  .toLowerCase();

 const stat=
  document.getElementById("statName")
  .value;

 const sv=
  document.getElementById("statValue")
  .value;

 const out=data.filter(c=>{

  if(q){

   const names=[
    c.character,
    ...attackValues(c)
     .map(a=>a.name)
   ]
   .join(" ")
   .toLowerCase();

   if(!names.includes(q))
    return false;

  }

  if(
   qs &&
   !String(c.symbol||"")
   .toLowerCase()
   .includes(qs)
  ){
   return false;
  }

  if(
   !matchSelected(
    selected.type,
    [c.type]
   )
  ){
   return false;
  }

  if(
   selected.char.length &&
   !matchSelected(
    selected.char,
    SPECIAL_SKILLS.filter(
     x=>hasChar(c,x)
    )
   )
  ){
   return false;
  }

  const at=
   attackValues(c);

  if(
   selected.attack.length||
   selected.range.length||
   selected.attr.length||
   selected.bullet.length||
   selected.special.length
  ){

   const ok=at.some(a=>{

    const idx=at.indexOf(a);

    const label=
     ATTACKS[idx]?.[1]||"";

    return(
     matchSelected(
      selected.attack,
      [label]
     ) &&
     matchSelected(
      selected.range,
      [a.range]
     ) &&
     matchSelected(
      selected.attr,
      a.attributes||[]
     ) &&
     matchSelected(
      selected.bullet,
      a.bulletTypes||[]
     ) &&
     matchSelected(
      selected.special,
      Object.keys(
       a.specials||{}
      ).filter(
       x=>a.specials[x]
      )
     )
    );

   });

   if(!ok)return false;

  }

  if(stat&&sv!==""){

   const v=
    Number(
     (c.stats||{})[stat]
    );

   if(!Number.isFinite(v))
    return false;

   if(
    statMode==="min" &&
    v<Number(sv)
   )return false;

   if(
    statMode==="max" &&
    v>Number(sv)
   )return false;

  }

  return true;

 });

 renderResults(out);

}

function renderResults(arr){

 const e=
  document.getElementById(
   "results"
  );

 if(!arr.length){

  e.innerHTML=
   '<div class="loading">該当するデータがありません。</div>';

  return;

 }

 e.innerHTML=
  `<div class="result-count">
   ${arr.length}件
  </div>`;

 arr.forEach(c=>{

  let h=`
   <div class="result">

    <div class="char">
     ${esc(c.character)}
    </div>

    <div class="muted">
     汎異記号：
     ${esc(c.symbol||"未登録")}
     /
     ${esc(c.type||"")}
    </div>
  `;

  const s=c.stats||{};

  h+=`

   <div>
    ${Object.entries({
     "総合つよさ":s.power,
     "体力":s.hp,
     "速力":s.speed,
     "陽攻":s.yangAtk,
     "陰攻":s.yinAtk,
     "陽防":s.yangDef,
     "陰防":s.yinDef
    })
    .filter(x=>
     x[1]!==undefined &&
     x[1]!==null &&
     x[1]!==""
    )
    .map(x=>`
     <span class="tag">
      ${x[0]}：${esc(x[1])}
     </span>
    `)
    .join("")}
   </div>
  `;

  h+=`

   <div>
    ${SPECIAL_SKILLS
     .filter(x=>hasChar(c,x))
     .map(x=>`
      <span class="tag">
       ${x}
      </span>
     `)
     .join("")}
   </div>
  `;

  Object.entries(
   c.attacks||{}
  ).forEach(([k,a])=>{

   const label=
    ATTACKS.find(
     x=>x[0]===k
    )?.[1]||k;

   if(!a.name)return;

   h+=`

    <div class="attack">

     <h4>
      ${label}
      <span class="tag">
       ${esc(a.range)}
      </span>
     </h4>

     <div>
      ${esc(a.name)}
     </div>

     ${(a.attributes||[])
      .map(x=>`
       <span class="tag attr">
        属性：${esc(x)}
       </span>
      `)
      .join("")}

     ${(a.bulletTypes||[])
      .map(x=>`
       <span class="tag bullet">
        ${esc(x)}
       </span>
      `)
      .join("")}

     ${Object.keys(
       a.specials||{}
      )
      .filter(x=>a.specials[x])
      .map(x=>`
       <span class="tag">
        ${x}
       </span>
      `)
      .join("")}

    </div>
   `;

  });

  h+="</div>";

  e.insertAdjacentHTML(
   "beforeend",
   h
  );

 });

}

  stats,

  attacks:attackData,

  details:{
   specialSkills:specialData,
   abilities,
   changeTraits
  }

 };

 msg.className="msg";

 msg.textContent=
  "保存中……";

 fetch(
  `${URL}/rest/v1/${TABLE}`,
  {
   method:"POST",
   headers:{
    "Content-Type":
     "application/json",
    apikey:KEY,
    Authorization:
     "Bearer "+KEY,
    Prefer:
     "return=minimal"
   },
   body:
    JSON.stringify(record)
  }
 )
 .then(async r=>{

  const t=await r.text();

  if(!r.ok)
   throw Error(t);

  msg.className="msg ok";

  msg.textContent=
   "保存しました！";

  load();

 })
 .catch(e=>{

  msg.className="msg err";

  msg.textContent=
   "保存失敗：\n"+
   e.message;

 });

}

/* =====================================================
   タブ
===================================================== */

document
.getElementById("tabSearch")
.onclick=()=>{

 document
  .getElementById("searchPage")
  .classList.remove("hidden");

 document
  .getElementById("addPage")
  .classList.add("hidden");

 document
  .getElementById("tabSearch")
  .classList.add("active");

 document
  .getElementById("tabAdd")
  .classList.remove("active");

 load();

};

document
.getElementById("tabAdd")
.onclick=()=>{

 document
  .getElementById("searchPage")
  .classList.add("hidden");

 document
  .getElementById("addPage")
  .classList.remove("hidden");

 document
  .getElementById("tabAdd")
  .classList.add("active");

 document
  .getElementById("tabSearch")
  .classList.remove("active");

 initEditors();
 initSpecialSkills();
 initChangeTraits();

};

===================================================== */

.onclick=save;

document
.getElementById("q")
.oninput=search;

document
.getElementById("qSymbol")
.oninput=search;

document
.getElementById("statName")

document
.getElementById("statValue")

.getElementById("andBtn")

 mode="AND";

 andBtn.classList.add(

 );

 orBtn.classList.remove(

 );

 search();

};

document
.getElementById("orBtn")
.onclick=()=>{

 mode="OR";

 orBtn.classList.add(
  "selected"
 );

 andBtn.classList.remove(
  "selected"
 );

 search();

};

document
.getElementById("statMin")
.onclick=()=>{

 statMode="min";

 statMin.classList.add(
  "selected"
 );

 statMax.classList.remove(
  "selected"
 );

 search();

};

document
.getElementById("statMax")
.onclick=()=>{

 statMode="max";

 statMax.classList.add(
  "selected"
 );

 statMin.classList.remove(
  "selected"
 );

 search();

};

document
.getElementById("reset")
.onclick=()=>{

 Object.values(selected)
 .forEach(a=>a.splice(0));

 document.getElementById(
  "q"
 ).value="";

 document.getElementById(
  "qSymbol"
 ).value="";

 document.getElementById(
  "statName"
 ).value="";

 document.getElementById(
  "statValue"
 ).value="";

 statMode="";

 buildFilters();

 search();

};

/* =====================================================
   起動
===================================================== */

load();

</script>
