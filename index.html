function esc(v){

return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/\"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function chips(id,arr,sel,fn){

const e=document.getElementById(id);

if(!e)return;

e.innerHTML="";

arr.forEach(x=>{

const b=document.createElement("button");

b.className=
"filter"+
(sel.includes(x)?" selected":"");

b.textContent=x;

b.onclick=()=>fn(x,b);

e.appendChild(b);

});

}


function toggle(arr,x,b){

const i=arr.indexOf(x);

if(i>=0){

arr.splice(i,1);
b.classList.remove("selected");

}else{

arr.push(x);
b.classList.add("selected");

}

search();

}

function getSkill(name){

if(!specialSkillData[name]){
specialSkillData[name]={
enabled:false
};
}

return specialSkillData[name];

}


function addToggleInput(
parent,
name,
label,
prop
){

const d=document.createElement("div");

d.className="ability-box";

const s=getSkill(name);

d.innerHTML=`

<div class="ability-title">
${name}
</div>

<div class="switch">
<button
type="button"
class="${s.enabled?"on":""}">
${s.enabled?"あり":"なし"}
</button>
</div>

<div class="special-detail ${s.enabled?"show":""}">

<div class="mini">${label}</div>

<input
class="input"
value="${esc(s[prop]||"")}"
>

</div>

`;

parent.appendChild(d);

const btn=d.querySelector("button");
const detail=d.querySelector(".special-detail");
const input=d.querySelector("input");

btn.onclick=()=>{

s.enabled=!s.enabled;

btn.classList.toggle(
"on",
s.enabled
);

btn.textContent=
s.enabled?"あり":"なし";

detail.classList.toggle(
"show",
s.enabled
);

};

input.oninput=()=>{
s[prop]=input.value;
};

}


function addSecondInput(
parent,
name,
label,
prop
){

const boxes=
[...parent.children];

const d=boxes.find(
x=>x.querySelector(".ability-title")?.textContent.trim()===name
);

if(!d)return;

const detail=d.querySelector(
".special-detail"
);

const input=document.createElement("input");

input.className="input";

input.type="number";

input.placeholder=label;

input.value=
getSkill(name)[prop]||"";

input.style.marginTop="6px";

detail.appendChild(input);

input.oninput=()=>{
getSkill(name)[prop]=input.value;
};

}

/* =========================================================
   検索
========================================================= */

function attackValues(c){

return Object.values(
c.attacks||{}
);

}


function flatSpecials(c){

const out=[];

attackValues(c).forEach(a=>{

Object.keys(
a.specials||{}
).forEach(k=>{

if(a.specials[k])
out.push(k);

});

});

return [...new Set(out)];

}


function hasChar(c,x){

const d=c.details||{};
const ss=d.specialSkills||{};

return !!(
ss[x]?.enabled
);

}


function matchSelected(
sel,
vals
){

if(!sel.length)return true;

return mode==="AND"
?sel.every(x=>vals.includes(x))
:sel.some(x=>vals.includes(x));

}


function search(){

const q=
document.getElementById("q")
.value.trim()
.toLowerCase();

const qs=
document.getElementById("qSymbol")
.value.trim()
.toLowerCase();

const stat=
document.getElementById("statName")
.value;

const sv=
document.getElementById("statValue")
.value;


const out=data.filter(c=>{

if(q){

const names=[
c.character,
...attackValues(c).map(
a=>a.name
)
].join(" ").toLowerCase();

if(!names.includes(q))
return false;

}


if(
qs &&
!String(c.symbol||"")
.toLowerCase()
.includes(qs)
)return false;


if(
!matchSelected(
selected.type,
[c.type]
)
)return false;


if(
selected.char.length &&
!matchSelected(
selected.char,
SPECIAL_SKILLS.filter(
x=>hasChar(c,x)
)
)
)return false;


const at=attackValues(c);


if(
selected.attack.length||
selected.range.length||
selected.attr.length||
selected.bullet.length||
selected.special.length
){

const ok=at.some(a=>{

const idx=at.indexOf(a);

const label=
ATTACKS[idx]?.[1]||"";

return(
matchSelected(
selected.attack,
[label]
)&&
matchSelected(
selected.range,
[a.range]
)&&
matchSelected(
selected.attr,
a.attributes||[]
)&&
matchSelected(
selected.bullet,
a.bulletTypes||[]
)&&
matchSelected(
selected.special,
Object.keys(
a.specials||{}
).filter(
x=>a.specials[x]
)
)
);

});

if(!ok)return false;

}


if(stat&&sv!==""){

const v=
Number(
(c.stats||{})[stat]
);

if(!Number.isFinite(v))
return false;

if(
statMode==="min" &&
v<Number(sv)
)return false;

if(
statMode==="max" &&
v>Number(sv)
)return false;

}

return true;

});

renderResults(out);

}


/* =========================================================
   結果表示
========================================================= */

function renderResults(arr){

const e=
document.getElementById("results");

if(!arr.length){

e.innerHTML=
'<div class="loading">該当するデータがありません。</div>';

return;

}


e.innerHTML=
`<div class="result-count">${arr.length}件</div>`;


arr.forEach(c=>{

let h=`

<div class="result">

<div class="char">
${esc(c.character)}
</div>

<div class="muted">
汎異記号：
${esc(c.symbol||"未登録")}
/
${esc(c.type||"")}
</div>

`;


const s=c.stats||{};


h+=`

<div>

${Object.entries({

総合つよさ:s.power,
体力:s.hp,
速力:s.speed,
陽攻:s.yangAtk,
陰攻:s.yinAtk,
陽防:s.yangDef,
陰防:s.yinDef

})
.filter(x=>x[1]!==undefined&&x[1]!="")
.map(x=>
`<span class="tag">
${x[0]}：${esc(x[1])}
</span>`
)
.join("")}

</div>

`;


Object.keys(
c.details?.specialSkills||{}
).forEach(k=>{

if(
c.details.specialSkills[k]?.enabled
){

h+=`
<span class="tag">
${esc(k)}
</span>
`;

}

});


Object.entries(
c.attacks||{}
).forEach(
([k,a])=>{

const label=
ATTACKS.find(
x=>x[0]===k
)?.[1]||k;

if(!a.name)return;


h+=`

<div class="attack">

<h4>
${label}

<span class="tag">
${esc(a.range)}
</span>

</h4>

<div>
${esc(a.name)}
</div>

${(a.attributes||[])
.map(x=>
`<span class="tag attr">
属性：${esc(x)}
</span>`
)
.join("")}

${(a.bulletTypes||[])
.map(x=>
`<span class="tag bullet">
${esc(x)}
</span>`
)
.join("")}

${Object.keys(a.specials||{})
.filter(x=>a.specials[x])
.map(x=>
`<span class="tag">
${esc(x)}
</span>`
)
.join("")}

</div>

`;

});


h+="</div>";

e.insertAdjacentHTML(
"beforeend",
h
);

});

}

/* =========================================================
   保存
========================================================= */

async function save(){

const msg=
document.getElementById(
"message"
);

const character=
document.getElementById(
"aCharacter"
).value.trim();

const symbol=
document.getElementById(
"aSymbol"
).value.trim();

const type=
document.getElementById(
"aType"
).value;


if(!character||!type){

msg.className="msg err";

msg.textContent=
"キャラクター名と式を入力してください。";

return;

}


/* 特殊スキル */

const specialSkills=
{};

SPECIAL_SKILLS.forEach(name=>{

specialSkills[name]=
specialSkillData[name]||{
enabled:false
};

});


/* 能力 */

const abilities={
...abilityData
};


/* ブースト・グレイズ */

const abilityBoxes=
document.querySelectorAll(
"#abilityEditors .ability-box"
);

const boostBox=
abilityBoxes[
abilityBoxes.length-2
];

const grazeBox=
abilityBoxes[
abilityBoxes.length-1
];


if(boostBox){

abilities.boost={
enabled:true,
target:
boostBox.querySelector(".target")?.value||"自身",
stat:
boostBox.querySelector(".stat")?.value||""
};

}


if(grazeBox){

abilities.graze={
enabled:true,
target:
grazeBox.querySelector(".target")?.value||"自身",
stat:
grazeBox.querySelector(".stat")?.value||""
};

}


/* 保存データ */

const details={

specialSkills,

abilities,

stats:{
power:num("sPower"),
hp:num("sHp"),
speed:num("sSpeed"),
yangAtk:num("sYangAtk"),
yinAtk:num("sYinAtk"),
yangDef:num("sYangDef"),
yinDef:num("sYinDef")
}

};


const record={
character,
symbol,
type,
attacks:attackData,
details
};


msg.className="msg";

msg.textContent="保存中……";


try{

const r=await fetch(
`${URL}/rest/v1/${TABLE}`,
{
method:"POST",

headers:{
"Content-Type":"application/json",
apikey:KEY,
Authorization:"Bearer "+KEY,
Prefer:"return=minimal"
},

body:JSON.stringify(record)

}
);

const t=await r.text();

if(!r.ok)
throw Error(t);

msg.className="msg ok";

msg.textContent=
"保存しました！";

data.push(record);

search();

}catch(e){

msg.className="msg err";

msg.textContent=
"保存失敗：\n"+e.message;

}

}
