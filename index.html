<script>

/* =========================================================

const URL="https://tuzeswyyprzudnznalue.supabase.co";
const KEY="sb_publishable_Zt-p9JvdQC9lOUTAM6x0Q_fTq1hU-W";

/* =========================================================
   基本データ定義
========================================================= */

const TYPES=["攻撃式","技巧式","速攻式","破壊式","防御式","支援式","回復式","妨害式"];
const ATTR=["日","月","火","水","木","金","土","星","無"];

const STATS=["陽攻","陰攻","陽防","陰防","CRI攻撃","CRI防御","CRI命中","CRI回避","速力","命中","回避"];
const STAT_TARGETS=["速力","陽攻","陰攻","陽防","陰防","命中","回避","注目","CRI攻撃","CRI命中","CRI回避","CRI防御"];
const BULLET_KINDS=["陽気","陰気"];
const STAT_TYPES_SHORT=["速力","陽攻","陰攻","陽防","陰防"];
const RANK2_STATS=["陽攻","陰攻","陽防","陰防","速力","回避","CRI攻撃","CRI命中","CRI回避"];
const RANK2_SOURCES=["スキル","スペルカード1","スペルカード2","ラストワード"];
const BULLETS=["通常弾","光弾","レーザー弾","質量弾","エネルギー弾","流体弾","尖弾","御札弾","斬撃弾","肉弾","ミサイル弾"];
const RANGES=["全体","単体"];
const ATTACKS=[
["spread","拡散ショット"],
["focus","集中ショット"],
["spell1","スペルカード1"],
["spell2","スペルカード2"],
["lastWord","ラストワード"]
];
const SPECIALS=["硬質弾","斬裂弾","貫通弾","必中弾","鏡面弾","弾性弾","爆破弾","特攻弾","粘着弾","衝撃弾","吸収弾","反動弾","焼却弾","氷解弾","放電弾","過剰弾"];
const SPECIAL_SKILLS=[
"ファスト","チャージ","RANKⅡバフ","RANKⅡデバフ","畜力","蓄積","共鳴","X-Change","禁止解除",
"有利属性ダメージアップ","不利属性ダメージアップ","属性強化","弾強化","弱点付与","団結",
"バディコネクト","ゾーン","スキル再使用ターン数短縮","大結界","逆相","スペルゲージ遅延",
"全体耐性ダウン","持続","ダメージダウン"
];

let data=[];
let mode="AND";
let editingId=null;

const selected={
 type:[], attack:[], range:[], attr:[], bullet:[], special:[], char:[]
};

let statMode="";

/* =========================================================
   初期構造生成関数
========================================================= */

function createBulletStructure(index){
 const b = {
  index: index, name: "", count: "", pStage: "P0", attr: "", bulletType: "通常弾", kind: "陽気",
  specials: {}, hardRatio:"", sharpRatio:"", stickyRate:"", impactRate:"", absorbRatio:"", recoilRatio:"", specialTarget:"",
  buffs: [], debuffs: []
 };
 SPECIALS.forEach(x => { b.specials[x] = false; });
 return b;
}

/* =========================================================
   バレット6個を必ず保証する
   5攻撃 × 6バレット = 必ず30個
========================================================= */

function normalizeBullet(bullet, index){
  const base = createBulletStructure(index);

  if(!bullet || typeof bullet !== "object"){
    return base;
  }

  return {
    ...base,
    ...bullet,
    index:index,

    specials:{
      ...base.specials,
      ...(bullet.specials || {})
    },

    buffs:Array.isArray(bullet.buffs) ? bullet.buffs : [],
    debuffs:Array.isArray(bullet.debuffs) ? bullet.debuffs : []
  };
}

function normalizeAttack(attack){
  const base = {
    name:"",
    range:"全体",
    attributes:[],
    bulletTypes:[],
    specials:{},

    hardRatio:"",
    sharpRatio:"",
    stickyRate:"",
    impactRate:"",
    absorbRatio:"",
    recoilRatio:"",
    specialTarget:"",

    buffs:[],
    debuffs:[],

    bullets:[]
  };

  const result = {
    ...base,
    ...(attack || {}),

    attributes:Array.isArray(attack?.attributes)
      ? attack.attributes
      : [],

    bulletTypes:Array.isArray(attack?.bulletTypes)
      ? attack.bulletTypes
      : [],

    buffs:Array.isArray(attack?.buffs)
      ? attack.buffs
      : [],

    debuffs:Array.isArray(attack?.debuffs)
      ? attack.debuffs
      : [],

    specials:{
      ...base.specials,
      ...(attack?.specials || {})
    },

    bullets:[]
  };

  const oldBullets =
    Array.isArray(attack?.bullets)
      ? attack.bullets
      : [];

  for(let i=0;i<6;i++){
    result.bullets.push(
      normalizeBullet(oldBullets[i], i + 1)
    );
  }

  return result;
}

function normalizeAllAttacks(source){
  const src = source || {};
  const result = {};

  ATTACKS.forEach(([key])=>{
    result[key] = normalizeAttack(src[key]);
  });

  return result;
}

function countAllBullets(){
  let total = 0;

  ATTACKS.forEach(([key])=>{
    total += Array.isArray(attackData[key]?.bullets)
      ? attackData[key].bullets.length
      : 0;
  });

  return total;
}

let attackData={};
function resetAttackData(){
  const empty={};

  ATTACKS.forEach(([key])=>{

    empty[key]={
      name:"",
      range:"全体",
      attributes:[],
      bulletTypes:[],
      specials:{},

      hardRatio:"",
      sharpRatio:"",
      stickyRate:"",
      impactRate:"",
      absorbRatio:"",
      recoilRatio:"",
      specialTarget:"",

      buffs:[],
      debuffs:[],

      bullets:[]
    };

    SPECIALS.forEach(x=>{
      empty[key].specials[x]=false;
    });

    for(let i=1;i<=6;i++){
      empty[key].bullets.push(
        createBulletStructure(i)
      );
    }
  });

  attackData=normalizeAllAttacks(empty);
}

resetAttackData();

let specialData={};
function resetSpecialData(){
 SPECIAL_SKILLS.forEach(x=>{
  if(x==="RANKⅡバフ" || x==="RANKⅡデバフ" || x==="ダメージダウン"){
   specialData[x]={ enabled:false, list:[] };
  }else{
   specialData[x]={ enabled:false };
  }
 });
}
resetSpecialData();

let abilityData={};
function resetAbilityData(){
 abilityData={
  conversion:{
   enabled:false, atkRank:false, atkAbnormal:[], defRank:false, defAbnormal:[],
   speedRank:false, speedAbnormal:[], spirit:false, spiritAbnormal:[], spiritValue:"",
   heal:false, healAbnormal:[], healValue:""
  },
  immunity:{
   effect:false, effectAbnormal:[], none:false, noneAbnormal:[], reflect:false, reflectAbnormal:[]
  },
  damageDown:{ good:"", bad:"" },
  damageUp:{ good:"", bad:"" },
  boost:{ enabled:false, target:"自身", stat:"" },
  graze:{ enabled:false, target:"自身", stat:"" }
 };
}
resetAbilityData();

/* =========================================================
   既存関数の安全なラッピング
   - 既存 buildBulletsEditorUI があれば先頭で正規化してから呼び出す
   - 既存 editCharacter があれば、読み込み前に attacks を正規化してから呼び出す
========================================================= */

if(typeof buildBulletsEditorUI === 'function'){
  const _old = buildBulletsEditorUI;
  buildBulletsEditorUI = function(attackKey){
    attackData[attackKey] = normalizeAttack(attackData[attackKey]);
    const a = attackData[attackKey];
    const container = document.getElementById(`bullets-container-${attackKey}`);
    if(!container) return _old(attackKey);
    // let the original implementation handle rendering; call it
    return _old(attackKey);
  };
}

if(typeof editCharacter === 'function'){
  const _oldEdit = editCharacter;
  editCharacter = function(c){
    if(c && c.attacks){
      let savedAttacks;
      try{
        savedAttacks = typeof c.attacks === 'string' ? JSON.parse(c.attacks) : c.attacks;
      }catch(e){
        console.error('attacks JSON解析失敗:',e);
        savedAttacks = {};
      }
      attackData = normalizeAllAttacks(savedAttacks);
    }else{
      resetAttackData();
    }

    // Ensure final normalization
    attackData = normalizeAllAttacks(attackData);

    console.log('編集データのバレット数:', countAllBullets());

    return _oldEdit(c);
  };
}

/* =========================================================
   保存処理の上書き（最後に定義された save が使用されます）
   必ず30バレットを保証してから Supabase に送信
========================================================= */

async function save(){

  const msg=document.getElementById("message");

  const character=
    document.getElementById("aCharacter").value.trim();

  const symbol=
    document.getElementById("aSymbol").value.trim();

  const type=
    document.getElementById("aType").value;

  if(!character || !type){

    msg.className="msg err";
    msg.textContent=
      "キャラクター名と式を入力してください。";

    return;
  }

  /*
    =====================================================
    保存直前に30バレットを必ず保証
    =====================================================
  */

  attackData=normalizeAllAttacks(attackData);

  const bulletCount=countAllBullets();

  console.log(
    "保存前バレット数:",
    bulletCount
  );

  if(bulletCount !== 30){

    msg.className="msg err";
    msg.textContent=
      `バレット数エラー：${bulletCount}/30`;

    console.error(
      "保存中止：バレット数が30ではありません。",
      attackData
    );

    return;
  }

  const num = (id) => {
    const v = document.getElementById(id)?.value;
    if(!v && v !== 0) return null;
    const n = Number(v);
    return isNaN(n) ? null : n;
  };

  /*
    =====================================================
    ステータス
    =====================================================
  */

  const stats={
    power:num("sPower"),
    hp:num("sHp"),
    speed:num("sSpeed"),
    yangAtk:num("sYangAtk"),
    yinAtk:num("sYinAtk"),
    yangDef:num("sYangDef"),
    yinDef:num("sYinDef")
  };

  /*
    =====================================================
    details
    =====================================================
  */

  const details={
    specialSkills: JSON.parse(JSON.stringify(specialData)),
    abilities: JSON.parse(JSON.stringify(abilityData)),
    stats
  };

  /*
    =====================================================
    attacks
    =====================================================
    保存専用コピーを作る。
  */

  const savedAttacks =
    JSON.parse(
      JSON.stringify(
        normalizeAllAttacks(attackData)
      )
    );

  let savedBulletCount=0;

  ATTACKS.forEach(([key])=>{

    if(!savedAttacks[key]){
      throw new Error(`${key} の攻撃データがありません`);
    }

    if(!Array.isArray(savedAttacks[key].bullets)){
      throw new Error(`${key} のbulletsが配列ではありません`);
    }

    if(savedAttacks[key].bullets.length !== 6){
      throw new Error(`${key} のバレット数が6ではありません`);
    }

    savedBulletCount += savedAttacks[key].bullets.length;
  });

  if(savedBulletCount !== 30){

    msg.className="msg err";
    msg.textContent=
      `保存前チェック失敗：${savedBulletCount}/30`;

    return;
  }

  const record={
    character,
    symbol,
    type,
    attacks:savedAttacks,
    details:details
  };

  msg.className="msg";
  msg.textContent=
    `保存中……（バレット ${savedBulletCount}/30）`;

  const isUpdate=!!editingId;

  const fetchUrl=isUpdate
    ? `${URL}/rest/v1/${TABLE}?id=eq.${encodeURIComponent(editingId)}`
    : `${URL}/rest/v1/${TABLE}`;

  const method=isUpdate ? "PATCH" : "POST";

  try{

    const r=await fetch(fetchUrl,{

      method,

      headers:{
        "Content-Type":"application/json",
        apikey:KEY,
        Authorization: "Bearer "+KEY,
        Prefer: "return=minimal"
      },

      body:JSON.stringify(record)
    });

    const t=await r.text();

    if(!r.ok){
      throw new Error(t);
    }

    msg.className="msg ok";

    msg.textContent=
      isUpdate
        ? "データを更新しました！\nバレット30個も保存済みです。"
        : "新規登録しました！\nバレット30個も保存済みです。";

    if(isUpdate){ resetFormToNew(); }

    await load();

  }catch(e){
    console.error("Supabase保存エラー:", e);
    msg.className="msg err";
    msg.textContent = "保存失敗：\n"+e.message;
  }
}

/* =========================================================
   buildBulletsEditorUI の先頭安全化（既存実装をラップ）
========================================================= */
if(typeof buildBulletsEditorUI === 'function'){
  // already wrapped above; nothing else needed
} else {
  // no-op placeholder to avoid errors
  function buildBulletsEditorUI(attackKey){
    attackData[attackKey] = normalizeAttack(attackData[attackKey]);
    const a = attackData[attackKey];
    const container = document.getElementById(`bullets-container-${attackKey}`);
    if(!container) return;
    container.innerHTML = '';
    a.bullets.slice(0,6).forEach((bulletObj, idx)=>{
      // minimal rendering to avoid breaking UI if original is missing
      const div = document.createElement('div');
      div.textContent = `${attackKey} バレット${idx+1}: ${bulletObj.name || ''}`;
      container.appendChild(div);
    });
  }
}

// done

</script>
