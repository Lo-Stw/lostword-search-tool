<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>東方ロストワード 弾幕検索</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;

    background: #f3f4f6;
    color: #222;
}

header {
    background: #242424;
    color: white;
    padding: 20px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

header p {
    margin: 6px 0 0;
    font-size: 12px;
    opacity: .75;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 12px;
}

/* =========================
   タブ
========================= */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.tab {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    background: white;
    font-size: 14px;
    font-weight: bold;
    color: #555;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

.tab.active {
    background: #333;
    color: white;
}

/* =========================
   ボックス
========================= */

.box {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.section {
    margin-bottom: 20px;
}

.section:last-child {
    margin-bottom: 0;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 9px;
}

/* =========================
   入力
========================= */

.input,
.select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fafafa;
    font-size: 16px;
    outline: none;
}

.input:focus,
.select:focus {
    border-color: #555;
    background: white;
}

/* =========================
   ボタン
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.filter-button {
    border: 1px solid #ccc;
    background: white;
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 13px;
}

.filter-button.selected {
    background: #333;
    color: white;
    border-color: #333;
}

/* =========================
   検索
========================= */

.mode {
    display: flex;
    gap: 8px;
}

.mode button {
    flex: 1;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
    font-size: 14px;
}

.mode button.selected {
    background: #333;
    color: white;
}

.reset,
.main-button,
.secondary-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
}

.reset {
    background: #e7e7e7;
}

.main-button {
    background: #333;
    color: white;
}

.secondary-button {
    background: #e8e8e8;
    color: #333;
}

/* =========================
   検索結果
========================= */

.result-count {
    font-weight: bold;
    margin: 15px 0 9px;
}

.result {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

.character {
    font-size: 18px;
    font-weight: bold;
}

.spell {
    margin-top: 5px;
    font-size: 15px;
}

.type {
    margin-top: 5px;
    color: #777;
    font-size: 13px;
}

.tags {
    margin-top: 9px;
}

.tag {
    display: inline-block;
    border-radius: 6px;
    padding: 5px 8px;
    margin: 2px;
    font-size: 12px;
}

.type-tag {
    background: #e8ddff;
}

.attribute {
    background: #fff1b8;
}

.bullet {
    background: #dceeff;
}

/* =========================
   弾幕入力
========================= */

.bullet-card {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
}

.bullet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: bold;
}

.remove-button {
    border: none;
    background: #ddd;
    border-radius: 7px;
    padding: 6px 9px;
    color: #555;
}

.two-column {
    display: flex;
    gap: 8px;
}

.two-column > div {
    flex: 1;
}

.small-label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

/* =========================
   作成データ
========================= */

.preview {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.success {
    background: #e6f7e9;
    color: #216b2c;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 13px;
}

/* =========================
   非表示
========================= */

.hidden {
    display: none;
}

/* =========================
   スマホ
========================= */

@media (max-width: 480px) {

    .container {
        padding: 9px;
    }

    .box {
        padding: 14px;
    }

    .two-column {
        flex-direction: column;
    }

}

</style>
</head>

<body>

<header>
    <h1>東方ロストワード</h1>
    <p>弾幕検索ツール</p>
</header>

<div class="container">

    <!-- =========================
         タブ
    ========================== -->

    <div class="tabs">

        <button
            id="searchTab"
            class="tab active"
            onclick="showPage('search')"
        >
            🔍 検索
        </button>

        <button
            id="addTab"
            class="tab"
            onclick="showPage('add')"
        >
            ➕ キャラ追加
        </button>

    </div>


    <!-- ==================================================
         検索ページ
    =================================================== -->

    <div id="searchPage">

        <div class="box">

            <div class="section">

                <div class="title">
                    キャラクター・スペカ検索
                </div>

                <input
                    id="keyword"
                    class="input"
                    type="text"
                    placeholder="キャラ名・スペカ名を入力"
                >

            </div>


            <div class="section">

                <div class="title">
                    式
                </div>

                <div
                    id="typeButtons"
                    class="buttons"
                ></div>

            </div>


            <div class="section">

                <div class="title">
                    属性
                </div>

                <div
                    id="attributeButtons"
                    class="buttons"
                ></div>

            </div>


            <div class="section">

                <div class="title">
                    弾種
                </div>

                <div
                    id="bulletButtons"
                    class="buttons"
                ></div>

            </div>


            <div class="section">

                <div class="title">
                    複数条件の検索方法
                </div>

                <div class="mode">

                    <button
                        id="andButton"
                        class="selected"
                    >
                        AND
                    </button>

                    <button
                        id="orButton"
                    >
                        OR
                    </button>

                </div>

            </div>


            <button
                id="resetButton"
                class="reset"
            >
                条件をリセット
            </button>

        </div>


        <div id="results">

            <div style="text-align:center;padding:30px">
                データを読み込んでいます……
            </div>

        </div>

    </div>


    <!-- ==================================================
         キャラ追加ページ
    =================================================== -->

    <div
        id="addPage"
        class="hidden"
    >

        <div class="box">

            <div class="section">

                <div class="title">
                    キャラクター名
                </div>

                <input
                    id="addCharacter"
                    class="input"
                    type="text"
                    placeholder="例：霧雨魔理沙"
                >

            </div>


            <div class="section">

                <div class="title">
                    スペカ名
                </div>

                <input
                    id="addSpell"
                    class="input"
                    type="text"
                    placeholder="例：恋符「マスタースパーク」"
                >

            </div>


            <div class="section">

                <div class="title">
                    式
                </div>

                <input
                    id="addType"
                    class="input"
                    type="text"
                    list="typeList"
                    placeholder="例：スペルカード1"
                >

                <datalist id="typeList"></datalist>

            </div>

        </div>

    </div>

</div>

<script>

let data = [];
let selectedTypes = [];
let selectedAttributes = [];
let selectedBullets = [];
let isAndMode = true;

loadData();

async function loadData() {

    const resultsArea =
        document.getElementById("results");

    try {

        resultsArea.innerHTML = `
            <div class="result">
                データを読み込んでいます……
            </div>
        `;

        const response = await fetch(
            "./data.json?" + Date.now()
        );

        if (!response.ok) {
            throw new Error(
                "HTTP " + response.status
            );
        }

        const text = await response.text();

        if (!text.trim()) {
            throw new Error(
                "data.jsonが空です"
            );
        }

        try {
            data = JSON.parse(text);
        } catch (e) {
            throw new Error(
                "data.jsonのJSON形式が正しくありません"
            );
        }

        if (!Array.isArray(data)) {
            throw new Error(
                "data.jsonの先頭は [ ] にしてください"
            );
        }

        createFilterButtons();
        updateDataPreview();
        updateTypeList();

        search();

    } catch (error) {

        console.error(error);

        resultsArea.innerHTML = `
            <div class="result">

                <div class="character">
                    ⚠️ データを読み込めませんでした
                </div>

                <br>

                <div>
                    ${escapeHTML(error.message)}
                </div>

                <br>

                <small>
                    data.jsonがindex.htmlと同じ場所にあるか確認してください。
                </small>

            </div>
        `;

    }

}

function escapeHTML(text) {
    const map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    };
    return text.replace(/[&<>"']/g, m => map[m]);
}

function createFilterButtons() {

    const types = [... new Set(data.map(item => item.type))];
    const attributes = [... new Set(data.map(item => item.attribute))];
    const bullets = [... new Set(data.map(item => item.bullet))];

    const typeButtons = document.getElementById("typeButtons");
    typeButtons.innerHTML = types.map(type => `
        <button class="filter-button" onclick="toggleFilter('type', '${escapeHTML(type)}')">
            ${escapeHTML(type)}
        </button>
    `).join("");

    const attributeButtons = document.getElementById("attributeButtons");
    attributeButtons.innerHTML = attributes.map(attr => `
        <button class="filter-button" onclick="toggleFilter('attribute', '${escapeHTML(attr)}')">
            ${escapeHTML(attr)}
        </button>
    `).join("");

    const bulletButtons = document.getElementById("bulletButtons");
    bulletButtons.innerHTML = bullets.map(bullet => `
        <button class="filter-button" onclick="toggleFilter('bullet', '${escapeHTML(bullet)}')">
            ${escapeHTML(bullet)}
        </button>
    `).join("");

}

function toggleFilter(filterType, value) {

    let selectedArray;
    if (filterType === "type") {
        selectedArray = selectedTypes;
    } else if (filterType === "attribute") {
        selectedArray = selectedAttributes;
    } else if (filterType === "bullet") {
        selectedArray = selectedBullets;
    }

    const index = selectedArray.indexOf(value);
    if (index > -1) {
        selectedArray.splice(index, 1);
    } else {
        selectedArray.push(value);
    }

    updateButtonStates(filterType);
    search();

}

function updateButtonStates(filterType) {

    let selectedArray, buttonIds;

    if (filterType === "type") {
        selectedArray = selectedTypes;
        buttonIds = "typeButtons";
    } else if (filterType === "attribute") {
        selectedArray = selectedAttributes;
        buttonIds = "attributeButtons";
    } else if (filterType === "bullet") {
        selectedArray = selectedBullets;
        buttonIds = "bulletButtons";
    }

    const buttons = document.getElementById(buttonIds).querySelectorAll(".filter-button");
    buttons.forEach(button => {
        const value = button.textContent;
        if (selectedArray.includes(value)) {
            button.classList.add("selected");
        } else {
            button.classList.remove("selected");
        }
    });

}

function search() {

    const keyword = document.getElementById("keyword").value.toLowerCase();

    let results = data.filter(item => {

        const matchesKeyword =
            !keyword ||
            item.character.toLowerCase().includes(keyword) ||
            item.spell.toLowerCase().includes(keyword);

        if (!matchesKeyword) return false;

        if (selectedTypes.length === 0 &&
            selectedAttributes.length === 0 &&
            selectedBullets.length === 0) {
            return true;
        }

        const typeMatch = selectedTypes.length === 0 || selectedTypes.includes(item.type);
        const attributeMatch = selectedAttributes.length === 0 || selectedAttributes.includes(item.attribute);
        const bulletMatch = selectedBullets.length === 0 || selectedBullets.includes(item.bullet);

        if (isAndMode) {
            return typeMatch && attributeMatch && bulletMatch;
        } else {
            return typeMatch || attributeMatch || bulletMatch;
        }

    });

    displayResults(results);

}

function displayResults(results) {

    const resultsArea = document.getElementById("results");

    if (results.length === 0) {
        resultsArea.innerHTML = `
            <div class="result">
                <div class="character">
                    検索結果がありません
                </div>
            </div>
        `;
        return;
    }

    const html = `
        <div class="result-count">
            検索結果：${results.length}件
        </div>
        ${results.map(item => `
            <div class="result">
                <div class="character">
                    ${escapeHTML(item.character)}
                </div>
                <div class="spell">
                    ${escapeHTML(item.spell)}
                </div>
                <div class="type">
                    ${escapeHTML(item.type)}
                </div>
                <div class="tags">
                    ${item.attribute ? `<span class="tag attribute">${escapeHTML(item.attribute)}</span>` : ""}
                    ${item.bullet ? `<span class="tag bullet">${escapeHTML(item.bullet)}</span>` : ""}
                </div>
            </div>
        `).join("")}
    `;

    resultsArea.innerHTML = html;

}

function resetFilters() {
    selectedTypes = [];
    selectedAttributes = [];
    selectedBullets = [];
    document.getElementById("keyword").value = "";
    updateButtonStates("type");
    updateButtonStates("attribute");
    updateButtonStates("bullet");
    search();
}

function showPage(page) {
    const searchPage = document.getElementById("searchPage");
    const addPage = document.getElementById("addPage");
    const searchTab = document.getElementById("searchTab");
    const addTab = document.getElementById("addTab");

    if (page === "search") {
        searchPage.classList.remove("hidden");
        addPage.classList.add("hidden");
        searchTab.classList.add("active");
        addTab.classList.remove("active");
    } else {
        searchPage.classList.add("hidden");
        addPage.classList.remove("hidden");
        searchTab.classList.remove("active");
        addTab.classList.add("active");
    }
}

function updateDataPreview() {
    const preview = document.getElementById("dataPreview");
    if (preview) {
        preview.textContent = JSON.stringify(data, null, 2);
    }
}

function updateTypeList() {
    const types = [... new Set(data.map(item => item.type))];
    const typeList = document.getElementById("typeList");
    typeList.innerHTML = types.map(type => `<option value="${escapeHTML(type)}"></option>`).join("");
}

document.getElementById("andButton").addEventListener("click", function() {
    isAndMode = true;
    this.classList.add("selected");
    document.getElementById("orButton").classList.remove("selected");
    search();
});

document.getElementById("orButton").addEventListener("click", function() {
    isAndMode = false;
    this.classList.add("selected");
    document.getElementById("andButton").classList.remove("selected");
    search();
});

document.getElementById("resetButton").addEventListener("click", resetFilters);
document.getElementById("keyword").addEventListener("input", search);

</script>

</body>
</html>
