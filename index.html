<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>東方ロストワード 弾幕検索</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}

header{
  background:#242424;
  color:#fff;
  padding:18px 12px;
  text-align:center
}

header h1{
  margin:0;
  font-size:21px
}

header p{
  margin:6px 0 0;
  font-size:12px;
  opacity:.8
}

.container{
  max-width:900px;
  margin:auto;
  padding:8px
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:8px
}

.tab{
  flex:1;
  padding:12px;
  border:0;
  border-radius:11px;
  background:#fff;
  font-weight:700
}

.tab.active{
  background:#333;
  color:#fff
}

.box{
  background:#fff;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;
  box-shadow:0 2px 7px #00000010
}

.section{
  margin-bottom:14px
}

.title{
  font-weight:700;
  font-size:14px;
  margin-bottom:7px
}

.input,.select{
  width:100%;
  padding:9px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:15px;
  background:#fafafa
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:5px
}

.filter{
  padding:7px 9px;
  border:1px solid #ccc;
  border-radius:18px;
  background:#fff;
  font-size:12px
}

.filter.selected{
  background:#333;
  color:#fff;
  border-color:#333
}

.range{
  display:flex;
  gap:7px
}

.range button{
  flex:1;
  padding:9px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:8px
}

.range button.selected{
  background:#333;
  color:#fff
}

.main{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#333;
  color:#fff;
  font-size:15px;
  font-weight:700
}

.sub{
  width:100%;
  padding:9px;
  border:0;
  border-radius:8px;
  background:#e7e7e7;
  margin-top:7px
}

.hidden{
  display:none
}

.result-count{
  font-weight:700;
  margin:12px 0 7px
}

.result{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:9px;
  box-shadow:0 2px 6px #0000000d
}

.char{
  font-size:17px;
  font-weight:700
}

.muted{
  color:#777;
  font-size:11px
}

.tag{
  display:inline-block;
  padding:3px 6px;
  margin:2px;
  border-radius:5px;
  font-size:10px;
  background:#eee
}

.attr{
  background:#fff1b8
}

.bullet{
  background:#dceeff
}

.attack{
  background:#f6f6f6;
  border-radius:9px;
  padding:9px;
  margin-top:8px
}

.attack h4{
  margin:0 0 4px
}

.editor{
  background:#f6f6f6;
  border-radius:11px;
  padding:10px;
  margin-bottom:9px
}

.editor h3{
  margin:0 0 8px;
  font-size:15px
}

.mini{
  font-size:11px;
  color:#666;
  margin-bottom:4px
}

.special-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:5px
}

.special-row{
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  padding:7px
}

.special-head{
  display:flex;
  align-items:center;
  gap:6px
}

.special-head b{
  flex:1;
  font-size:12px
}

.special-head button{
  min-width:58px;
  padding:6px 8px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:7px;
  font-size:11px
}

.special-head button.on{
  background:#333;
  color:#fff
}

.special-detail{
  display:none;
  margin-top:6px
}

.special-detail.show{
  display:block
}

.skill-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px
}

.skill-card{
  background:#f6f6f6;
  border:1px solid #ddd;
  border-radius:9px;
  padding:8px
}

.skill-title{
  font-size:12px;
  font-weight:700;
  margin-bottom:6px
}

.skill-buttons{
  display:flex;
  gap:5px
}

.skill-buttons button{
  flex:1;
  padding:6px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:7px;
  font-size:11px
}

.skill-buttons button.on{
  background:#333;
  color:#fff
}

.skill-detail{
  display:none;
  margin-top:6px
}

.skill-detail.show{
  display:block
}

.radio-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px
}

.radio-option{
  position:relative
}

.radio-option input{
  position:absolute;
  opacity:0
}

.radio-option label{
  display:block;
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
  background:#fff;
  text-align:center;
  font-size:11px
}

.radio-option input:checked+label{
  background:#333;
  color:#fff;
  border-color:#333
}

.msg{
  margin-top:8px;
  padding:9px;
  border-radius:8px;
  font-size:12px;
  white-space:pre-wrap
}

.ok{
  background:#e4f6e7
}

.err{
  background:#ffe5e5
}

.loading{
  text-align:center;
  padding:25px;
  color:#777
}

.required{
  color:#c33;
  font-size:10px
}

.compact-status .input{
  padding:7px 6px;
  font-size:12px
}

.compact-status .input::placeholder{
  font-size:11px
}

@media(max-width:600px){
  .row3{
    grid-template-columns:repeat(3,1fr)
  }

  .skill-grid{
    grid-template-columns:1fr
  }

  .container{
    padding:6px
  }
}
</style>
</head>

<body>

<header>
<h1>東方ロストワード</h1>
<p>弾幕・スペルカード検索ツール</p>
</header>

<div class="container">

<div class="tabs">
<button id="tabSearch" class="tab active">🔍 検索</button>
<button id="tabAdd" class="tab">➕ キャラ追加</button>
</div>

<!-- ===================== 検索 ===================== -->

<section id="searchPage">

<div class="box">

<div class="section">
<div class="title">キャラクター・スペカ検索</div>
<input id="q" class="input" placeholder="キャラ名・スペカ名">
</div>

<div class="section">
<div class="title">汎異記号</div>
<input id="qSymbol" class="input" placeholder="汎異記号">
</div>

<div class="section">
<div class="title">式</div>
<div id="fType" class="buttons"></div>
</div>

<div class="section">
<div class="title">攻撃種</div>
<div id="fAttack" class="buttons"></div>
</div>

<div class="section">
<div class="title">全体・単体</div>
<div id="fRange" class="buttons"></div>
</div>

<div class="section">
<div class="title">属性</div>
<div id="fAttr" class="buttons"></div>
</div>

<div class="section">
<div class="title">弾種</div>
<div id="fBullet" class="buttons"></div>
</div>

<div class="section">
<div class="title">特殊弾</div>
<div id="fSpecial" class="buttons"></div>
</div>

<div class="section">
<div class="title">特殊スキル</div>
<div id="fSkill" class="buttons"></div>
</div>

<div class="section">

<div class="title">ステータス検索</div>

<div class="row">
<select id="statName" class="select">
<option value="">ステータス</option>
<option value="power">総合つよさ</option>
<option value="hp">体力</option>
<option value="speed">速力</option>
<option value="yangAtk">陽攻</option>
<option value="yinAtk">陰攻</option>
<option value="yangDef">陽防</option>
<option value="yinDef">陰防</option>
</select>

<input id="statValue" type="number" class="input" placeholder="数値">
</div>

<div class="range" style="margin-top:6px">
<button id="statMin">以上</button>
<button id="statMax">以下</button>
</div>

</div>

<div class="section">

<div class="title">複数条件</div>

<div class="range">
<button id="andBtn" class="selected">AND</button>
<button id="orBtn">OR</button>
</div>

</div>

<button id="reset" class="sub">条件をリセット</button>

</div>

<div id="results">
<div class="loading">データを読み込んでいます……</div>
</div>

</section>

<!-- ===================== キャラ追加 ===================== -->

<section id="addPage" class="hidden">

<div class="box">

<div class="section">
<div class="title">キャラクター名</div>
<input id="aCharacter" class="input" placeholder="例：霧雨魔理沙">
</div>

<div class="section">
<div class="title">汎異記号</div>
<input id="aSymbol" class="input" placeholder="例：A6">
</div>

<div class="section">
<div class="title">式</div>
<select id="aType" class="select">
<option value="">選択してください</option>
<option>攻撃式</option>
<option>技巧式</option>
<option>速攻式</option>
<option>破壊式</option>
<option>防御式</option>
<option>支援式</option>
<option>回復式</option>
<option>妨害式</option>
</select>
</div>

<!-- ステータス -->

<div class="section compact-status">

<div class="title">ステータス</div>

<div class="row3">

<input id="sPower" type="number" class="input" placeholder="総合">
<input id="sHp" type="number" class="input" placeholder="体力">
<input id="sSpeed" type="number" class="input" placeholder="速力">

<input id="sYangAtk" type="number" class="input" placeholder="陽攻">
<input id="sYinAtk" type="number" class="input" placeholder="陰攻">
<input id="sYangDef" type="number" class="input" placeholder="陽防">

<input id="sYinDef" type="number" class="input" placeholder="陰防">

</div>

</div>

</div>

<!-- ===================== 特殊スキル ===================== -->

<div class="box">

<div class="title">特殊スキル</div>

<div id="skillEditors" class="skill-grid"></div>

</div>

<!-- ===================== 能力 ===================== -->

<div class="box">

<div class="title">能力</div>

<div class="section">
<div class="mini">結界異常耐性</div>
<div id="resistances" class="buttons"></div>
</div>

<div class="section">
<div class="mini">有利属性</div>
<div id="goodAttrs" class="buttons"></div>
</div>
