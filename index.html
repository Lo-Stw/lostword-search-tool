<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f4f6;
  color:#222;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif

header{

}

header h1{

}

  margin:6px 0 0;

}

.container{
  max-width:900px;
  margin:auto;
  padding:8px
}

.tabs{
  display:flex;
  gap:7px;
  margin-bottom:8px
}

.tab{
  flex:1;
  padding:12px;
  border:0;
  border-radius:11px;
  background:#fff;
  font-weight:700
}

.tab.active{
  background:#333;
  color:#fff
}

.box{
  background:#fff;
  border-radius:14px;
  padding:13px;
  margin-bottom:10px;

}

.section{

}

.title{
  font-weight:700;

  margin-bottom:7px
}

.input,.select{

  background:#fafafa
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px

.row3{
  display:grid;

.buttons{

.filter{

.range{

}

.range button.selected{
  background:#333;
  color:#fff
}

.main{
  width:100%;
  padding:12px;
  border:0;
  border-radius:9px;
  background:#333;
  color:#fff;
  font-size:15px;
  font-weight:700
}

.sub{
  width:100%;
  padding:9px;
  border:0;

}

.hidden{
  display:none
}

.result-count{
  font-weight:700;

}

.result{
  background:#fff;
  border-radius:12px;
  padding:12px;

}

.char{
  font-size:17px;
  font-weight:700
}

.muted{
  color:#777;
  font-size:11px
}

.tag{
  display:inline-block;
  padding:3px 6px;
  margin:2px;
  border-radius:5px;
  font-size:10px;
  background:#eee
}

.attr{
  background:#fff1b8
}

.bullet{
  background:#dceeff
}

.attack{
  background:#f6f6f6;
  border-radius:9px;
  padding:9px;
  margin-top:8px
}

.attack h4{
  margin:0 0 4px
}

.editor{
  background:#f6f6f6;
  border-radius:11px;
  padding:10px;
  margin-bottom:9px
}

.editor h3{
  margin:0 0 8px;
  font-size:15px
}

.mini{
  font-size:11px;
  color:#666;
  margin-bottom:4px
}

.special-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:5px
}

.special-row{
  background:#fff;
  border:1px solid #ddd;
  border-radius:8px;
  padding:7px
}

.special-head{
  display:flex;
  align-items:center;
  gap:6px
}

.special-head b{
  flex:1;
  font-size:12px
}

.special-head button{
  min-width:58px;
  padding:6px 8px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:7px;
  font-size:11px
}

.special-head button.on{
  background:#333;
  color:#fff
}

.special-detail{
  display:none;
  margin-top:6px
}

.special-detail.show{
  display:block
}

/* 特殊スキル用（2つ目の方式） */
.ability{
  border:1px solid #ddd;
  border-radius:10px;
  padding:10px;
  margin-bottom:9px;
  background:#fafafa
}

.ability-title{
  font-weight:700;
  margin-bottom:8px
}

.switch{
  display:flex;
  gap:6px
}

.switch button{
  flex:1;
  padding:8px;
  border:1px solid #ccc;
  background:#fff;
  border-radius:8px;
  font-size:13px;
  text-align:left
}

.switch button.on{
  background:#333;
  color:#fff
}

.radio-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px
}

.radio-option{
  position:relative
}

.radio-option input{
  position:absolute;
  opacity:0
}

.radio-option label{
  display:block;
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
  background:#fff;
  text-align:center;
  font-size:11px
}

.radio-option input:checked+label{
  background:#333;
  color:#fff;
  border-color:#333
}

.msg{
  margin-top:8px;
  padding:9px;
  border-radius:8px;
  font-size:12px;
  white-space:pre-wrap
}

.ok{
  background:#e4f6e7
}

.err{
  background:#ffe5e5
}

.loading{
  text-align:center;
  padding:25px;
  color:#777
}

.required{
  color:#c33;
  font-size:10px
}

.compact-status .input{
  padding:7px 6px;
  font-size:12px
}

.compact-status .input::placeholder{
  font-size:11px
}

@media(max-width:600px){
  .row3{
    grid-template-columns:repeat(3,1fr)
  }

  .container{
    padding:6px
  }
}
</style>
</head>

<script>

const URL="https://tuzeswyyprzudnznalue.supabase.co";
const KEY="sb_publishable_Zt-pb9JvdQC9lOUTAM6x0Q_fTq1hU-W";
const TABLE="characters";

const TYPES=[
"攻撃式","技巧式","速攻式","破壊式",
"防御式","支援式","回復式","妨害式"
];

const ATTR=[
"日","月","火","水","木","金","土","星"
];

const BULLETS=[
"通常弾","光弾","レーザー弾","質量弾",
"エネルギー弾","流体弾","尖弾","御札弾",
"斬撃弾","肉弾","ミサイル弾"
];

const RANGES=["全体","単体"];

const ATTACKS=[
["spread","拡散ショット"],
["focus","集中ショット"],
["spell1","スペルカード1"],
["spell2","スペルカード2"],
["lastWord","ラストワード"]
];

const SPECIALS=[
"硬質弾","斬裂弾","貫通弾","必中弾","鏡面弾",
"弾性弾","爆破弾","特効弾","粘着弾","衝撃弾",
"吸収弾","反動弾","焼却弾","氷解弾","放電弾",
"過毒弾","閃光弾"
];

const STAT_TYPES=[
"速力","陽攻","陰攻","陽防","陰防"
];

/* 特殊スキル（2つ目のリストに合わせる） */
const SPECIAL_SKILLS=[
"禁止解除",
"有利属性ダメージアップ",
"不利属性ダメージアップ",
"属性強化",
"弾強化",
"弱点付与",
"団結",
"バディコネクト",
"ゾーン",
"スキル再使用ターン数短縮",
"大結界",
"逆相",
"スペルゲージ遅延",
"全体耐性ダウン",
"RANKⅡバフ",
"RANKⅡデバフ",
"畜力",
"共鳴",
"蓄積",
"持続"
];

const CHANGE_TRAITS=[
"アタック連携",
"ガード連携",
"スピード連携",
"パワー連携",
"スキル連携",
"バイタル連携"
];

const STATS=[
"陽攻","陰攻","陽防","陰防",
"CRI攻撃","CRI防御","CRI命中","CRI回避",
"速力","命中","回避"
];

let data=[];
let mode="AND";
let statMode="";
let changeTrait="";

const selected={
type:[],
attack:[],
range:[],
attr:[],
bullet:[],
special:[],
skill:[]
};

/* =========================================================
   特殊スキルデータ（2つ目の方式）
========================================================= */

const specialData={};

SPECIAL_SKILLS.forEach(x=>{
 specialData[x]={
  enabled:false
 };
});

function esc(v){
return String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function createSpecials(){

const o={};

SPECIALS.forEach(x=>{
o[x]={
enabled:false,
value:""
};
});

return o;

}

function createAttacks(){

const o={};

ATTACKS.forEach(([key])=>{
o[key]={
name:"",
range:"全体",
attributes:[],
bulletTypes:[],
specials:createSpecials()
};
});

return o;

}

let attackData=createAttacks();

function chips(id,arr,sel,fn){

const e=document.getElementById(id);

if(!e)return;

e.innerHTML="";

arr.forEach(x=>{

const b=document.createElement("button");

b.className="filter"+(sel.includes(x)?" selected":"");

b.textContent=x;

b.onclick=()=>fn(x,b);

e.appendChild(b);

});

}

function toggle(arr,x,b){

const i=arr.indexOf(x);

if(i>=0){
arr.splice(i,1);
b.classList.remove("selected");
}else{
arr.push(x);
b.classList.add("selected");
}

search();

}

function buildFilters(){

chips("fType",TYPES,selected.type,(x,b)=>toggle(selected.type,x,b));

chips("fAttack",ATTACKS.map(x=>x[1]),selected.attack,(x,b)=>toggle(selected.attack,x,b));

chips("fRange",RANGES,selected.range,(x,b)=>toggle(selected.range,x,b));

chips("fAttr",ATTR,selected.attr,(x,b)=>toggle(selected.attr,x,b));

chips("fBullet",BULLETS,selected.bullet,(x,b)=>toggle(selected.bullet,x,b));

chips("fSpecial",SPECIALS,selected.special,(x,b)=>toggle(selected.special,x,b));

chips("fSkill",SPECIAL_SKILLS,selected.skill,(x,b)=>toggle(selected.skill,x,b));

}

/* =====================================================
   特殊弾
===================================================== */

function specialInputType(name){

if(
name==="硬質弾"||
name==="斬裂弾"||
name==="吸収弾"||
name==="反動弾"
)return "倍率 %";

if(
name==="粘着弾"||
name==="衝撃弾"
)return "発動率 %";

return "";

}

function buildSpecialControls(key){

const a=attackData[key];

const e=document.getElementById("as-"+key);

e.innerHTML="";

SPECIALS.forEach(name=>{

const d=a.specials[name];

const inputLabel=specialInputType(name);

const row=document.createElement("div");

row.className="special-row";

row.innerHTML=`

<div class="special-head">

<b>${name}</b>

<button type="button" class="${d.enabled?"on":""}">
${d.enabled?"あり":"なし"}
</button>

</div>

<div class="special-detail ${d.enabled&&inputLabel?"show":""}">

${inputLabel?`
<input
class="input"
type="number"
placeholder="${inputLabel}"
value="${esc(d.value)}"
>
`:""}

</div>
`;

e.appendChild(row);

const btn=row.querySelector("button");
const detail=row.querySelector(".special-detail");
const input=row.querySelector("input");

btn.onclick=()=>{

d.enabled=!d.enabled;

btn.classList.toggle("on",d.enabled);

btn.textContent=d.enabled?"あり":"なし";

if(inputLabel){
detail.classList.toggle("show",d.enabled);
}

};

if(input){
input.oninput=()=>d.value=input.value;
}

});

}

/* =====================================================
   攻撃
===================================================== */

function buildBulletControls(key){

const a=attackData[key];

const e=document.getElementById("ab-"+key);

e.innerHTML="";

BULLETS.forEach(name=>{

const on=a.bulletTypes.includes(name);

const b=document.createElement("button");

b.className="filter"+(on?" selected":"");

b.textContent=name+"："+(on?"あり":"なし");

b.onclick=()=>{

const i=a.bulletTypes.indexOf(name);

if(i>=0){
a.bulletTypes.splice(i,1);
}else{
a.bulletTypes.push(name);
}

const state=a.bulletTypes.includes(name);

b.classList.toggle("selected",state);

b.textContent=name+"："+(state?"あり":"なし");

};

e.appendChild(b);

});

}

function initEditors(){

const e=document.getElementById("attackEditors");

e.innerHTML="";

ATTACKS.forEach(([key,label])=>{

const a=attackData[key];

const d=document.createElement("div");

d.className="editor";

d.innerHTML=`

<h3>${label}</h3>

<div class="section">
<div class="mini">名前</div>
<input class="input"
value="${esc(a.name)}"
data-k="${key}"
data-p="name">
</div>

<div class="section">
<div class="mini">全体・単体</div>
<select class="select"
data-k="${key}"
data-p="range">
<option ${a.range==="全体"?"selected":""}>全体</option>
<option ${a.range==="単体"?"selected":""}>単体</option>
</select>
</div>

<div class="section">
<div class="mini">属性</div>
<div id="aa-${key}" class="buttons"></div>
</div>

<div class="section">
<div class="mini">弾種</div>
<div id="ab-${key}" class="buttons"></div>
</div>

<div class="section">
<div class="mini">特殊弾</div>
<div id="as-${key}" class="special-grid"></div>
</div>

`;

e.appendChild(d);

chips(
"aa-"+key,
ATTR,
a.attributes,
(x,b)=>{

const i=a.attributes.indexOf(x);

if(i>=0){
a.attributes.splice(i,1);
b.classList.remove("selected");
}else{
a.attributes.push(x);
b.classList.add("selected");
}

}
);

buildBulletControls(key);
buildSpecialControls(key);

});

document.querySelectorAll("[data-p]").forEach(el=>{

el.oninput=()=>{
attackData[el.dataset.k][el.dataset.p]=el.value;
};

});

}

/* =========================================================
   特殊スキルUI（2つ目の方式）
========================================================= */

function initSpecialSkills(){

 const e=document.getElementById("specialSkillEditor");

 e.innerHTML="";

 SPECIAL_SKILLS.forEach(skill=>{

  const box=document.createElement("div");

  box.className="ability";

  box.innerHTML=`

   <div class="switch">
    <button
     type="button"
     id="ss-${skill}"
     class="${specialData[skill].enabled?"on":""}">
     ${skill}：
     ${specialData[skill].enabled?"あり":"なし"}
    </button>
   </div>

   <div
    id="sd-${skill}"
    class="${specialData[skill].enabled?"":"hidden"}"
    style="margin-top:8px">
   </div>
  `;

  e.appendChild(box);

  const btn=box.querySelector("button");
  const detail=box.querySelector(`#sd-${skill}`);

  btn.onclick=()=>{

   specialData[skill].enabled=
    !specialData[skill].enabled;

   btn.classList.toggle(
    "on",
    specialData[skill].enabled
   );

   btn.textContent=
    skill+"："+
    (specialData[skill].enabled?"あり":"なし");

   detail.classList.toggle(
    "hidden",
    !specialData[skill].enabled
   );

   buildSpecialDetail(skill,detail);

  };

  buildSpecialDetail(skill,detail);

 });

}

/* =========================================================
   特殊スキル詳細（2つ目の方式）
========================================================= */

function buildSpecialDetail(skill,e){

 if(!specialData[skill].enabled){
  e.innerHTML="";
  return;
 }

 if(
  skill==="有利属性ダメージアップ" ||
  skill==="不利属性ダメージアップ"
 ){

  e.innerHTML=`
   <input
    class="input"
    type="number"
    placeholder="倍率 %"
    data-special="${skill}"
    value="${esc(specialData[skill].value||"")}">
  `;

 }

 else if(skill==="属性強化"){

  e.innerHTML=`

/* =====================================================
   検索
===================================================== */

function attackSpecialNames(a){

return Object.entries(a.specials||{})
.filter(([k,v])=>
typeof v==="object"
?v.enabled
:v===true
)
.map(([k])=>k);

}

function skillExists(c,name){

const s=c.details?.specialSkills||c.details?.skills||{};

if(s[name]?.enabled)return true;

if(c.details?.[name])return true;

return false;

}

function matchSelected(sel,vals){

if(!sel.length)return true;

return mode==="AND"
?sel.every(x=>vals.includes(x))
:sel.some(x=>vals.includes(x));

}

function search(){

const q=document.getElementById("q").value.trim().toLowerCase();
const qs=document.getElementById("qSymbol").value.trim().toLowerCase();

const stat=document.getElementById("statName").value;
const sv=document.getElementById("statValue").value;

const out=data.filter(c=>{

if(q){

const names=[
c.character,
...Object.values(c.attacks||{}).map(a=>a.name)
].join(" ").toLowerCase();

if(!names.includes(q))return false;

}

if(
qs &&
!String(c.symbol||"").toLowerCase().includes(qs)
)return false;

if(!matchSelected(selected.type,[c.type]))
return false;

const attacks=Object.values(c.attacks||{});

if(
selected.attack.length||
selected.range.length||
selected.attr.length||
selected.bullet.length||
selected.special.length
){

const ok=attacks.some((a,index)=>{

const label=ATTACKS[index]?.[1]||"";

return(
matchSelected(selected.attack,[label])&&
matchSelected(selected.range,[a.range])&&
matchSelected(selected.attr,a.attributes||[])&&
matchSelected(selected.bullet,a.bulletTypes||[])&&
matchSelected(selected.special,attackSpecialNames(a))
);

});

if(!ok)return false;

}

if(selected.skill.length){

const ok=selected.skill.some(x=>skillExists(c,x));

if(mode==="AND"){

if(!selected.skill.every(x=>skillExists(c,x)))
return false;

}else if(!ok){

return false;

}

}

if(stat&&sv!==""){

const v=Number((c.stats||{})[stat]);

if(!Number.isFinite(v))return false;

if(statMode==="min"&&v<Number(sv))
return false;

if(statMode==="max"&&v>Number(sv))
return false;

}

return true;

});

renderResults(out);

}

${esc(c.character)}
</div>

<div class="muted">

</div>

h+=`

${Object.entries({
"総合":s.power,
"体力":s.hp,
"速力":s.speed,
"陽攻":s.yangAtk,
"陰攻":s.yinAtk,

"陰防":s.yinDef
})

.map(x=>

)

/* 特殊スキル表示 */

 SPECIAL_SKILLS
 .filter(x=>ss[x]?.enabled)
 .map(x=>`<span class="tag">${x}</span>`)
 .join("")
}
</div>
`;

Object.entries(c.attacks||{}).forEach(([k,a])=>{

const label=
ATTACKS.find(x=>x[0]===k)?.[1]||k;

if(!a.name)return;

h+=`

<div class="attack">

<h4>
${label}
<span class="tag">${esc(a.range||"")}</span>
</h4>

<div>${esc(a.name)}</div>

${(a.attributes||[]).map(x=>
`<span class="tag attr">属性：${esc(x)}</span>`
).join("")}

${(a.bulletTypes||[]).map(x=>
`<span class="tag bullet">${esc(x)}</span>`
).join("")}

${attackSpecialNames(a).map(x=>
`<span class="tag">${esc(x)}</span>`
).join("")}

</div>

`;

});

h+="</div>";

e.insertAdjacentHTML("beforeend",h);

});

}

===================================================== */

function num(id){

const e=document.getElementById(id);

if(!e||e.value==="")return null;

return Number(e.value);

}

function save(){

const msg=document.getElementById("message");

const character=
document.getElementById("aCharacter").value.trim();

const symbol=
document.getElementById("aSymbol").value.trim();

const type=
document.getElementById("aType").value;

if(!character||!type){

msg.className="msg err";
msg.textContent="キャラクター名と式を入力してください。";
return;

}

if(!changeTrait){

msg.className="msg err";
msg.textContent="チェンジ特性を1つ選択してください。";
return;

}

const stats={

power:num("sPower"),
hp:num("sHp"),
speed:num("sSpeed"),
yangAtk:num("sYangAtk"),
yinAtk:num("sYinAtk"),
yangDef:num("sYangDef"),
yinDef:num("sYinDef")

};

const details={
specialSkills:specialData,
abilities,
changeTrait
};

const record={
character,
symbol,
type,
stats,
attacks:attackData,
details
};

msg.className="msg";
msg.textContent="保存中……";

fetch(
`\( {URL}/rest/v1/ \){TABLE}`,
{
method:"POST",
headers:{
"Content-Type":"application/json",
apikey:KEY,
Authorization:"Bearer "+KEY,
Prefer:"return=minimal"
},
body:JSON.stringify(record)
}
)
.then(async r=>{

const t=await r.text();

if(!r.ok)throw Error(t);

msg.className="msg ok";
msg.textContent="保存しました！";

data.push(record);

buildFilters();
search();

})
.catch(e=>{

msg.className="msg err";
msg.textContent="保存失敗：\n"+e.message;

});

}

document.getElementById("statMax").onclick=()=>{

statMode="max";

document.getElementById("statMax").classList.add("selected");
document.getElementById("statMin").classList.remove("selected");

search();

};

document.getElementById("statName").onchange=search;
document.getElementById("statValue").oninput=search;

document.getElementById("reset").onclick=()=>{

Object.values(selected).forEach(a=>a.splice(0));

document.getElementById("q").value="";
document.getElementById("qSymbol").value="";
document.getElementById("statName").value="";
document.getElementById("statValue").value="";

statMode="";

buildFilters();
search();

};
