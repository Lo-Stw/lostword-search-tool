<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>東方ロストワード 弾幕検索</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;

    background: #f3f4f6;
    color: #222;
}

header {
    background: #242424;
    color: white;
    padding: 20px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

header p {
    margin: 6px 0 0;
    font-size: 12px;
    opacity: .75;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 12px;
}

/* =========================
   タブ
========================= */

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.tab {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 13px 8px;
    background: white;
    font-size: 14px;
    font-weight: bold;
    color: #555;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

.tab.active {
    background: #333;
    color: white;
}

/* =========================
   ボックス
========================= */

.box {
    background: white;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.section {
    margin-bottom: 20px;
}

.section:last-child {
    margin-bottom: 0;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 9px;
}

/* =========================
   入力
========================= */

.input,
.select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 10px;
    background: #fafafa;
    font-size: 16px;
    outline: none;
}

.input:focus,
.select:focus {
    border-color: #555;
    background: white;
}

/* =========================
   ボタン
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.filter-button {
    border: 1px solid #ccc;
    background: white;
    border-radius: 20px;
    padding: 8px 13px;
    font-size: 13px;
}

.filter-button.selected {
    background: #333;
    color: white;
    border-color: #333;
}

/* =========================
   検索
========================= */

.mode {
    display: flex;
    gap: 8px;
}

.mode button {
    flex: 1;
    padding: 11px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: white;
    font-size: 14px;
}

.mode button.selected {
    background: #333;
    color: white;
}

.reset,
.main-button,
.secondary-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
}

.reset {
    background: #e7e7e7;
}

.main-button {
    background: #333;
    color: white;
}

.secondary-button {
    background: #e8e8e8;
    color: #333;
}

/* =========================
   検索結果
========================= */

.result-count {
    font-weight: bold;
    margin: 15px 0 9px;
}

.result {
    background: white;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

.character {
    font-size: 18px;
    font-weight: bold;
}

.spell {
    margin-top: 5px;
    font-size: 15px;
}

.type {
    margin-top: 5px;
    color: #777;
    font-size: 13px;
}

.tags {
    margin-top: 9px;
}

.tag {
    display: inline-block;
    border-radius: 6px;
    padding: 5px 8px;
    margin: 2px;
    font-size: 12px;
}

.type-tag {
    background: #e8ddff;
}

.attribute {
    background: #fff1b8;
}

.bullet {
    background: #dceeff;
}

/* =========================
   弾幕入力
========================= */

.bullet-card {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
}

.bullet-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    font-weight: bold;
}

.remove-button {
    border: none;
    background: #ddd;
    border-radius: 7px;
    padding: 6px 9px;
    color: #555;
}

.two-column {
    display: flex;
    gap: 8px;
}

.two-column > div {
    flex: 1;
}

.small-label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

/* =========================
   作成データ
========================= */

.preview {
    background: #f7f7f7;
    border-radius: 10px;
    padding: 12px;
    margin-top: 12px;
    font-size: 13px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.success {
    background: #e6f7e9;
    color: #216b2c;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 12px;
    font-size: 13px;
}

/* =========================
   非表示
========================= */

.hidden {
    display: none;
}

/* =========================
   スマホ
========================= */

@media (max-width: 480px) {

    .container {
        padding: 9px;
    }

    .box {
        padding: 14px;
    }

    .two-column {
        flex-direction: column;
    }

}

</style>
</head>

<body>

<header>
    <h1>東方ロストワード</h1>
    <p>弾幕検索ツール</p>
</header>

<div class="container">

    <!-- =========================
         タブ
    ========================== -->

    <div class="tabs">

        <button
            id="searchTab"
            class="tab active"
            onclick="showPage('search')"
        >
            🔍 検索
        </button>

        <button
            id="addTab"
            class="tab"
            onclick="showPage('add')"
        >
            ➕ キャラ追加
        </button>

    </div>


    <!-- ==================================================
         検索ページ
    =================================================== -->

    <div id="searchPage">

        <div class="box">

            <div class="section">

                <div class="title">
                    キャラクター・スペカ検索
                </div>

                <input
                    id="keyword"
                    class="input"
                    type="text"
                    placeholder="キャラ名・スペカ名を入力"
                >

            </div>


            <div class="section">

                <div class="title">
                    式
                </div>

                <div
                    id="typeButtons"
                    class="buttons"
                ></div>

            </div>


            <div class="section">

                <div class="title">
                    属性
                </div>

                <div
                    id="attributeButtons"
                    class="buttons"
                ></div>

            </div>


            <div class="section">

                <div class="title">
                    弾種
                </div>

                <div
                    id="bulletButtons"
                    class="buttons"
                ></div>

            </div>


            <div class="section">

                <div class="title">
                    複数条件の検索方法
                </div>

                <div class="mode">

                    <button
                        id="andButton"
                        class="selected"
                    >
                        AND
                    </button>

                    <button
                        id="orButton"
                    >
                        OR
                    </button>

                </div>

            </div>


            <button
                id="resetButton"
                class="reset"
            >
                条件をリセット
            </button>

        </div>


        <div id="results">

            <div style="text-align:center;padding:30px">
                データを読み込んでいます……
            </div>

        </div>

    </div>


    <!-- ==================================================
         キャラ追加ページ
    =================================================== -->

    <div
        id="addPage"
        class="hidden"
    >

        <div class="box">

            <div class="section">

                <div class="title">
                    キャラクター名
                </div>

                <input
                    id="addCharacter"
                    class="input"
                    type="text"
                    placeholder="例：霧雨魔理沙"
                >

            </div>


            <div class="section">

                <div class="title">
                    スペカ名
                </div>

                <input
                    id="addSpell"
                    class="input"
                    type="text"
                    placeholder="例：恋符「マスタースパーク」"
                >

            </div>


            <div class="section">

                <div class="title">
                    式
                </div>

                <input
                    id="addType"
                    class="input"
                    type="text"
                    list="typeList"
                    placeholder="例：スペルカード1"
                >

                <datalist id="typeList"></datalist>

            </div>

        </div>

        <!-- rest of content omitted for brevity in this message -->
