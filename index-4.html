<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>東方ロストワード 弾幕検索</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}header{background:#242424;color:#fff;padding:18px;text-align:center}h1{margin:0;font-size:21px}.container{max-width:900px;margin:auto;padding:8px}.tabs{display:flex;gap:8px;margin-bottom:8px}.tab,.filter,.range button,.switch button{border:1px solid #ccc;background:#fff;border-radius:9px;padding:9px}.tab{flex:1;font-weight:bold}.active,.on,.selected{background:#333!important;color:#fff!important}.box{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 7px #0001}.title{font-weight:bold;margin-bottom:7px}.section{margin-bottom:12px}.input,.select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;background:#fafafa;font-size:15px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.buttons{display:flex;flex-wrap:wrap;gap:5px}.filter{font-size:12px;padding:7px 9px;border-radius:18px}.range{display:flex;gap:6px}.range button{flex:1}.main,.sub{width:100%;padding:11px;border:0;border-radius:8px;font-weight:bold}.main{background:#333;color:#fff}.sub{background:#e7e7e7;margin-top:6px}.hidden{display:none}.editor{background:#f5f5f5;border-radius:10px;padding:9px;margin:7px 0}.editor h3{font-size:15px;margin:0 0 7px}.special-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.special-row{background:#fff;border:1px solid #ddd;border-radius:8px;padding:6px}.special-head{display:flex;align-items:center;gap:5px}.special-head b{font-size:12px;flex:1}.special-head button{border:1px solid #ccc;background:#fff;border-radius:7px;padding:6px 8px}.detail{margin-top:5px}.loading{text-align:center;padding:25px;color:#777}.result{background:#fff;border-radius:12px;padding:12px;margin-bottom:8px}.tag{display:inline-block;background:#eee;border-radius:5px;padding:3px 6px;margin:2px;font-size:11px}.attr{background:#fff1b8}.bullet{background:# </style></head><body>
<header><h1>東方ロストワード</h1><div>弾幕・スペルカード検索ツール</div></header><main class="container">
<div class="tabs"><button id="tabSearch" class="tab active">🔍 検索</button><button id="tabAdd" class="tab">➕ キャラ追加</button></div>

</div><div id="results"><div class="loading">データを読み込んでいます……</div></div></section>
<section id="addPage" class="hidden">
<div class="box"><div class="section"><div class="title">キャラクター名</div><input id="aCharacter" class="input"></div><div class="section"><div class="title">汎異記号</div><input id="aSymbol" class="input"></div><div class="section"><div class="title">式</div><select id="aType" class="select"><option value="">選択してください</option><option>攻撃式</option><option>技巧式</option><option>速攻式</option><option>破壊式</option><option>防御式</option><option>支援式</option><option>回復式</option><option>妨害式</option></select></div>

</section></main>
<script>
const URL="https://tuzeswyyprzudnznalue.supabase.co",KEY="sb_publishable_Zt-pb9JvdQC9lOUTAM6x0Q_fTq1hU-W",TABLE="characters";
const TYPES=["攻撃式","技巧式","速攻式","破壊式","防御式","支援式","回復式","妨害式"],ATTR=["日","月","火","水","木","金","土","星"],RANGES=["全体","単体"];
const BULLETS=["通常弾","光弾","レーザー弾","質量弾","エネルギー弾","流体弾","尖弾","御札弾","斬撃弾","肉弾","ミサイル弾"];
const ATTACKS=[["spread","拡散ショット"],["focus","集中ショット"],["spell1","スペルカード1"],["spell2","スペルカード2"],["lastWord","ラストワード"]];
const SPECIALS=["硬質弾","斬���弾","貫通弾","必中弾","鏡面弾","弾性弾","爆破弾","特効弾","粘着弾","衝撃弾","吸収弾","反動弾","焼却弾","氷解弾","放電弾","過毒弾","閃光弾"];
const SKILLS=["禁止解除","有利属性ダメージアップ","不利属性ダメージアップ","属性強化","弾強化","弱点付与","団結","バディコネクト","ゾーン","スキル再使用ターン数短縮","大結界","逆相","スペルゲージ遅延","全体耐性ダウン","RANKⅡバフ","RANKⅡデバフ","持続","蓄積","共鳴","ダメージダウン"];
const CHANGE=["アタック連携","ガード連携","スピード連携","パワー連携","シールド連携","バイタル連携"],BUFF=["速力","陽攻","陰攻","陽防","陰防"],BOOST=["ダメージ","CRIダメージ","霊力","攻撃時CRI率","速力"];
let data=[],mode="AND",statMode="",selected={type:[],attack:[],range:[],attr:[],bullet:[],special:[],char:[]},abilities={resistance:[],good:[],bad:[]},changeTraits=[];
let skillData={},attackData={};SKILLS.forEach(k=>skillData[k]={enabled:false,details:{}});ATTACKS.forEach(([k])=>attackData[k]={name:"",range:"全体",attributes:[],bulletTypes:[],specials:{},specialDetails:{}});
const esc=x=>String(x??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function chips(id,arr,sel,fn){let e=document.getElementById(id);e.innerHTML="";arr.forEach(x=>{let b=document.createElement("button");b.className="filter"+(sel.includes(x)?" selected":"");b.textContent=x;b.onclick=()=>fn(x,b);e.appendChild(b)})}
function tog(a,x,b){let i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);b.classList.toggle("selected",a.includes(x));search()}
function filters(){chips("fType",TYPES,selected.type,tog.bind(null,selected.type));chips("fAttack",ATTACKS.map(x=>x[1]),selected.attack,tog.bind(null,selected.attack));chips("fRange",RANGES,selected.range,tog.bind(null,selected.range));chips("fAttr",ATTR,selected.attr,tog.bind(null,selected.attr));chips("fBullet",BULLETS,selected.bullet,tog.bind(null,selected.bullet));chips("fSpecial",SPECIALS,selected.special,tog.bind(null,selected.special));chips("fChar",SKILLS,selected.char,tog.bind(null,selected.char))}
function match(s,v){return !s.length||(mode==="AND"?s.every(x=>v.includes(x)):s.some(x=>v.includes(x)))}
function skillDetail(k){
let d=skillData[k].details,h="";
const inp=(p,l,ph,t="text")=>`<div class="section"><div>${l}</div><input class="input" type="${t}" data-s="${k}" data-p="${p}" placeholder="${ph}" value="${esc(d[p]??"")}"></div>`;
const sel=(p,l,a)=>`<div class="section"><div>${l}</div><select class="select" data-s="${k}" data-p="${p}"><option value="">選択</option>${a.map(x=>`<option ${d[p]===x?"selected":""}>${x}</option>`).join("")}</select></div>`;
if(k==="禁止解除")h+=inp("count","解除する数","いくつ");
if(["有利属性ダメージアップ","不利属性ダメージアップ"].includes(k))h+=inp("ratio","倍率 %","倍率","number");
if(k==="属性強化")h+=sel("attribute","属性",ATTR)+inp("ratio","倍率 %","倍率","number");
if(k==="弾強化")h+=sel("bullet","弾種",BULLETS)+inp("ratio","倍率 %","倍率","number");
if(k==="弱点付与")h+=sel("attribute","付与属性",ATTR);
if(k==="団結")h+=inp("fixed","固定倍率","倍率")+inp("perPerson","1人あたりの倍率","倍率")+sel("boost","強化するもの",["霊力",...BOOST]);
if(k==="バディコネクト")h+=sel("boost","アップするもの",["霊力",...BOOST]);
if(k==="ゾーン")h+=inp("fixed","固定倍率","倍率")+inp("perPerson","1人あたりの倍率","倍率")+sel("boost","強化するもの",BOOST);
if(k==="スキル再使用ターン数短縮")h+=inp("turns","短縮ターン数","ターン数");
if(k==="大結界")h+=inp("allyWhat","味方全体：アップするもの","例：陽攻")+inp("allyRatio","味方全体：倍率 %","倍率","number")+inp("enemyWhat","相手全体：ダウンするもの","例：陰防")+inp("enemyRatio","相手全体：倍率 %","倍率","number")+inp("breakEffect","破界効果","入力");
if(k==="逆相")h+=inp("upWhat","アップするもの","例：陽攻")+inp("upRatio","アップ倍率 %","倍率","number")+inp("downWhat","ダウンするもの","例：陽防")+inp("downRatio","ダウン倍率 %","倍率","number");
if(k==="スペルゲージ遅延")h+=inp("amount","遅延量","入力");
if(k==="全体耐性ダウン")h+=inp("ratio","ダウン倍率 %","倍率","number");
if(k==="RANKⅡバフ")h+=sel("boost","バフ",BUFF)+inp("ratio","倍率 %","倍率","number");
if(k==="RANKⅡデバフ")h+=sel("boost","デバフ",BUFF)+inp("ratio","倍率 %","倍率","number");
if(k==="持続")h+=inp("turns","持続ターン数","ターン数")+sel("scope","効果範囲",["味方全体","自身"])+sel("effect","効果",["霊力上昇","体力回復","禁止解除","結界増加"])+inp("amount","効果量","霊力なら数値／回復なら％／解除なら個数／結界なら枚数");
if(k==="蓄積")h+=sel("boost","強化するもの",["陽攻","陰攻","陽防","陰防","速力"]);
if(k==="共鳴")h+=sel("boost","強化するもの",BOOST);
if(k==="ダメージダウン")h+=sel("defense","特防の種類",["○属性特防","○○弾特防","種族特防"]);
return h}
function initSkills(){let e=document.getElementById("skills");e.innerHTML="";SKILLS.forEach(k=>{let w=document.createElement("div");w.className="editor";w.innerHTML=`<div class="switch"><button id="sk-${k}" class="${skillData[k].enabled?"on":""}">${k}：${skillData[k].enabled?"あり":"なし"}</button></div><div id="sd-${k}" class="detail ${skillData[k].enabled?"":"hidden"}">${skillDetail(k)}</div>`;e.appendChild(w);document.getElementById("sk-"+k).onclick=()=>{skillData[k].enabled=!skillData[k].enabled;initSkills()}});document.querySelectorAll("[data-s]").forEach(x=>x.oninput=()=>skillData[x.dataset.s].details[x.dataset.p]=x.value)}
function initAttacks(){let e=document.getElementById("attacks");e.innerHTML="";ATTACKS.forEach(([k,l])=>{let a=attackData[k],d=document.createElement("div");d.className="editor";d.innerHTML=`<h3>${l}</h3><input class="input" data-a="${k}" data-p="name" placeholder="名前" value="${esc(a.name)}"><select class="select" data-a="${k}" data-p="range"><option ${a.range==="全体"?"selected":""}>全体</option><option ${a.range==="単体"?"selected":""}>単体</option></select><div class="mini">属性</div><div id="at-${k}" class="buttons"></div><div class="mini">弾種</div><div id="bu-${k}" class="buttons"></div><div class="mini">特殊弾</div><div id="sp-${k}" class="special-grid"></div>`;e.appendChild(d);chips("at-"+k,ATTR,a.attributes,(x,b)=>{let i=a.attributes.indexOf(x);i<0?a.attributes.push(x):a.attributes.splice(i,1);b.classList.toggle("selected",a.attributes.includes(x))});BULLETS.forEach(x=>{let b=document.createElement("button");b.className="filter"+(a.bulletTypes.includes(x)?" selected":"");b.textContent=x+"："+(a.bulletTypes.includes(x)?"あり":"なし");b.onclick=()=>{let i=a.bulletTypes.indexOf(x);i<0?a.bulletTypes.push(x):a.bulletTypes.splice(i,1);b.classList.toggle("selected",a.bulletTypes.includes(x));b.textContent=x+"："+(a.bulletTypes.includes(x)?"あり":"なし")};document.getElementById("bu-"+k).appendChild(b)});SPECIALS.forEach(x=>{let r=document.createElement("div");r.className="special-row";let detailed=["硬質弾","斬裂弾","粘着弾","衝撃弾","吸収弾","反動弾"].includes(x);r.innerHTML=`<div class="special-head"><b>${x}</b><button>${a.specials[x]?"あり":"なし"}</button></div>${detailed?`<div class="detail"><input class="input" type="number" placeholder="${["粘着弾","衝撃弾"].includes(x)?"発動率 %":"倍率"}"></div>`:""}`;document.getElementById("sp-"+k).appendChild(r);let b=r.querySelector("button"),i=r.querySelector("input");b.onclick=()=>{a.specials[x]=!a.specials[x];b.classList.toggle("on",a.specials[x]);b.textContent=a.specials[x]?"あり":"なし";if(i)i.value=a.specialDetails[x]||""};if(i)i.oninput=()=>a.specialDetails[x]=i.value})});document.querySelectorAll("[data-a]").forEach(x=>x.oninput=()=>attackData[x.dataset.a][x.dataset.p]=x.value)}
function initAbilities(){chips("resistances",["毒霧","帯電","燃焼","凍結","暗闇","無効化"],abilities.resistance,(x,b)=>{let i=abilities.resistance.indexOf(x);i<0?abilities.resistance.push(x):abilities.resistance.splice(i,1);b.classList.toggle("selected",abilities.resistance.includes(x))});chips("goodAttrs",ATTR,abilities.good,(x,b)=>{let i=abilities.good.indexOf(x);i<0?abilities.good.push(x):abilities.good.splice(i,1);b.classList.toggle("selected",abilities.good.includes(x))});chips("badAttrs",ATTR,abilities.bad,(x,b)=>{let i=abilities.bad.indexOf(x);i<0?abilities.bad.push(x):abilities.bad.splice(i,1);b.classList.toggle("selected",abilities.bad.includes(x))});chips("changeTraits",CHANGE,changeTraits,(x,b)=>{let i=changeTraits.indexOf(x);i<0?changeTraits.push(x):changeTraits.splice(i,1);b.classList.toggle("selected",changeTraits.includes(x))})}
function render(arr){let e=document.getElementById("results");if(!arr.length){e.innerHTML='<div class="loading">該当するデータがありません。</div>';return}e.innerHTML=`<div><b>${arr.length}件</b></div>`;arr.forEach(c=>{let h=`<div class="result"><div><b>${esc(c.character)}</b></div><small>汎異記号：${esc(c.symbol||"未登録")} / ${esc(c.type||"")}</small><div>`;let s=c.stats||{};Object.entries({総合つよさ:s.power,体力:s.hp,速力:s.speed,陽攻:s.yangAtk,陰攻:s.yinAtk,陽防:s.yangDef,陰防:s.yinDef}).forEach(([k,v])=>{if(v!=null)h+=`<span class="tag">${k}：${esc(v)}</span>`});h+="</div>";SKILLS.filter(k=>c.details?.specialSkills?.[k]?.enabled||c.details?.[k]?.enabled).forEach(k=>h+=`<span class="tag">${k}</span>`);Object.entries(c.attacks||{}).forEach(([k,a])=>{if(!a.name)return;let l=ATTACKS.find(x=>x[0]===k)?.[1]||k;h+=`<div class="editor"><b>${l}</b> ${esc(a.name)}<div>${(a.attributes||[]).map(x=>`<span class="tag attr">属性:${esc(x)}</span>`).join("")}${(a.bulletTypes||[]).map(x=>`<span class="tag bullet">${esc(x)}</span>`).join("")}</div></div>`});e.insertAdjacentHTML("beforeend",h+"</div>")})}
function search(){let q=document.getElementById("q").value.toLowerCase(),qs=document.getElementById("qSymbol").value.toLowerCase(),sn=document.getElementById("statName").value,sv=document.getElementById("statValue").value;let out=data.filter(c=>{if(q&&!([c.character,...Object.values(c.attacks||{}).map(a=>a.name||"")].join(" ").toLowerCase().includes(q)))return false;if(qs&&!String(c.symbol||"").toLowerCase().includes(qs))return false;if(!match(selected.type,[c.type]))return false;let cs=SKILLS.filter(k=>c.details?.specialSkills?.[k]?.enabled||c.details?.[k]?.enabled);if(selected.char.length&&!match(selected.char,cs))return false;let at=Object.values(c.attacks||{});if(selected.attack.length||selected.range.length||selected.attr.length||selected.bullet.length||selected.special.length){if(!at.some((a,i)=>match(selected.attack,[ATTACKS[i]?.[1]||""])&&match(selected.range,[a.range])&&match(selected.attr,a.attributes||[])&&match(selected.bullet,a.bulletTypes||[])&&match(selected.special,Object.keys(a.specials||{}).filter(x=>a.specials[x]))))return false}if(sn&&sv!=""){let v=Number((c.stats||{})[sn]);if(!Number.isFinite(v))return false;if(statMode==="min"&&v<Number(sv)||statMode==="max"&&v>Number(sv))return false}return true});render(out)}
async function load(){let e=document.getElementById("results");e.innerHTML='<div class="loading">データを読み込んでいます……</div>';try{let ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),8000),r=await fetch(`${URL}/rest/v1/${TABLE}?select=*`,{headers:{apikey:KEY,Authorization:"Bearer "+KEY},signal:ctl.signal});clearTimeout(tm);let t=await r.text();if(!r.ok)throw Error(t);data=JSON.parse(t);filters();search()}catch(x){e.innerHTML=`<div class="result"><b>データ読み込みエラー</b><br>${x.name==="AbortError"?"通信がタイムアウトしました。":"Supabase："+esc(x.message)}<button class="sub" onclick="load()">再読み込み</button></div>`}}
function save(){let m=document.getElementById("message"),character=document.getElementById("aCharacter").value.trim(),type=document.getElementById("aType").value;if(!character||!type){m.className="msg err";m.textContent="キャラクター名と式を入力してください。";return}let stats={power:+document.getElementById("sPower").value||null,hp:+document.getElementById("sHp").value||null,speed:+document.getElementById("sSpeed").value||null,yangAtk:+document.getElementById("sYangAtk").value||null,yinAtk:+document.getElementById("sYinAtk").value||null,yangDef:+document.getElementById("sYangDef").value||null,yinDef:+document.getElementById("sYinDef").value||null};let rec={character,symbol:document.getElementById("aSymbol").value.trim(),type,stats,attacks:attackData,details:{specialSkills:skillData,abilities,changeTraits}};m.className="msg";m.textContent="保存中……";fetch(`${URL}/rest/v1/${TABLE}`,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY,Prefer:"return=minimal"},body:JSON.stringify(rec)}).then(async r=>{let t=await r.text();if(!r.ok)throw Error(t);m.className="msg ok";m.textContent="保存しました！";load()}).catch(x=>{m.className="msg err";m.textContent="保存失敗：\n"+x.message})}
tabSearch.onclick=()=>{searchPage.classList.remove("hidden");addPage.classList.add("hidden");tabSearch.classList.add("active");tabAdd.classList.remove("active");load()};tabAdd.onclick=()=>{searchPage.classList.add("hidden");addPage.classList.remove("hidden");tabAdd.classList.add("active");tabSearch.classList.remove("active");initSkills();initAttacks();initAbilities()};save.onclick=save;q.oninput=search;qSymbol.oninput=search;andBtn.onclick=()=>{mode="AND";andBtn.classList.add("selected");orBtn.classList.remove("selected");search()};orBtn.onclick=()=>{mode="OR";orBtn.classList.add("selected");andBtn.classList.remove("selected");search()};statMin.onclick=()=>{statMode="min";statMin.classList.add("selected");statMax.classList.remove("selected");search()};statMax.onclick=()=>{statMode="max";statMax.classList.add("selected");statMin.classList.remove("selected");search()};statName.onchange=search;statValue.oninput=search;reset.onclick=()=>{Object.values(selected).forEach(a=>a.splice(0));q.value=qSymbol.value=statValue.value="";statName.value="";statMode="";filters();search()};load();
</script></body></html>
