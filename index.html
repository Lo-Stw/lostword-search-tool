<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>東方ロストワード 弾幕検索</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;

    background: #f3f4f6;
    color: #222;
}


/* =========================
   ヘッダー
========================= */

header {
    background: #242424;
    color: white;
    padding: 20px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 7px 0 0;
    font-size: 13px;
    opacity: 0.8;
}


/* =========================
   コンテナ
========================= */

.container {
    max-width: 800px;
    margin: auto;
    padding: 15px;
}


/* =========================
   検索ボックス
========================= */

.search-box {
    background: white;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 15px;

    box-shadow:
        0 2px 8px rgba(0,0,0,0.08);
}


.section {
    margin-bottom: 20px;
}


.section:last-child {
    margin-bottom: 0;
}


.section-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 10px;
}


/* =========================
   キーワード
========================= */

.search-input {
    width: 100%;

    padding: 13px;

    border: 1px solid #ccc;
    border-radius: 10px;

    font-size: 16px;

    outline: none;
}


.search-input:focus {
    border-color: #555;
}


/* =========================
   フィルターボタン
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}


.filter-button {
    border: 1px solid #ccc;

    background: white;

    border-radius: 20px;

    padding: 9px 14px;

    font-size: 14px;

    cursor: pointer;
}


.filter-button:active {
    transform: scale(0.96);
}


.filter-button.selected {
    background: #333;

    color: white;

    border-color: #333;
}


/* =========================
   AND / OR
========================= */

.mode {
    display: flex;
    gap: 8px;
}


.mode button {
    flex: 1;

    padding: 11px;

    border: 1px solid #ccc;

    background: white;

    border-radius: 9px;

    font-size: 14px;
}


.mode button.selected {
    background: #333;

    color: white;

    border-color: #333;
}


/* =========================
   リセット
========================= */

.reset {
    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 9px;

    background: #e5e5e5;

    font-size: 15px;

    cursor: pointer;
}


/* =========================
   選択条件
========================= */

.selected-info {
    margin-top: 10px;

    font-size: 12px;

    color: #777;

    line-height: 1.6;
}


/* =========================
   結果
========================= */

.result-count {
    font-weight: bold;

    margin: 15px 0 10px;
}


.result {
    background: white;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 10px;

    box-shadow:
        0 2px 6px rgba(0,0,0,0.06);
}


.character {
    font-size: 18px;

    font-weight: bold;
}


.spell {
    margin-top: 5px;

    font-size: 15px;
}


.type {
    margin-top: 5px;

    color: #777;

    font-size: 13px;
}


/* =========================
   タグ
========================= */

.tags {
    margin-top: 10px;
}


.tag {
    display: inline-block;

    border-radius: 6px;

    padding: 5px 8px;

    margin: 2px;

    font-size: 12px;
}


.type-tag {
    background: #e8ddff;
}


.attribute {
    background: #fff1b8;
}


.bullet {
    background: #dceeff;
}


/* =========================
   その他
========================= */

.no-result {
    text-align: center;

    color: #777;

    padding: 35px 10px;
}


.loading {
    text-align: center;

    padding: 30px;
}


/* =========================
   スマホ
========================= */

@media (max-width: 480px) {

    .container {
        padding: 10px;
    }

    .search-box {
        padding: 15px;
    }

    .filter-button {
        font-size: 13px;

        padding: 8px 12px;
    }

}

</style>
</head>


<body>


<header>

    <h1>
        東方ロストワード
    </h1>

    <p>
        ��幕検索ツール
    </p>

</header>


<div class="container">


    <!-- =========================
         検索
    ========================== -->

    <div class="search-box">


        <!-- キーワード -->

        <div class="section">

            <div class="section-title">
                キャラクター・スペカ検索
            </div>

            <input
                id="keyword"
                class="search-input"
                type="text"
                placeholder="キャラ名・スペカ名を入力"
            >

        </div>


        <!-- 式 -->

        <div class="section">

            <div class="section-title">
                式
            </div>

            <div
                id="typeButtons"
                class="buttons"
            ></div>

        </div>


        <!-- 属性 -->

        <div class="section">

            <div class="section-title">
                属性
            </div>

            <div
                id="attributeButtons"
                class="buttons"
            ></div>

        </div>


        <!-- 弾種 -->

        <div class="section">

            <div class="section-title">
                弾種
            </div>

            <div
                id="bulletButtons"
                class="buttons"
            ></div>

        </div>


        <!-- AND / OR -->

        <div class="section">

            <div class="section-title">
                複数条件の検索方法
            </div>

            <div class="mode">

                <button
                    id="andButton"
                    class="selected"
                >
                    AND
                </button>

                <button
                    id="orButton"
                >
                    OR
                </button>

            </div>


            <div
                id="selectedInfo"
                class="selected-info"
            >
                条件を選択すると表示されます
            </div>

        </div>


        <!-- リセット -->

        <button
            id="resetButton"
            class="reset"
        >
            条件をリセット
        </button>


    </div>


    <!-- =========================
         結果
    ========================== -->

    <div id="results">

        <div class="loading">
            データを読み込んでいます……
        </div>

    </div>


</div>


<script>


/* =========================================
   データ
========================================= */

let data = [];


/* =========================================
   選択状態
========================================= */

let selectedTypes = [];

let selectedAttributes = [];

let selectedBullets = [];

let searchMode = "AND";


/* =========================================
   データ読み込み
========================================= */

async function loadData() {

    try {

        const response =
            await fetch("data.json");


        if (!response.ok) {

            throw new Error(
                "data.jsonを読み込めませんでした"
            );

        }


        data =
            await response.json();


        /*
         * データから
         * 式・属性・弾種を自動取得
         */

        createFilterButtons();


        search();


    } catch (error) {

        console.error(error);


        document
            .getElementById("results")
            .innerHTML = `

                <div class="no-result">

                    データの読み込みに失敗しました。

                    <br><br>

                    <small>
                    data.json が
                    index.html と同じ場所にあるか
                    確認してください。
                    </small>

                </div>

            `;

    }

}


/* =========================================
   フィルター作成
========================================= */

function createFilterButtons() {


    const types =
        [
            ...new Set(
                data
                    .map(item => item.type)
                    .filter(Boolean)
            )
        ];


    const attributes =
        [
            ...new Set(
                data.flatMap(
                    item =>
                        Array.isArray(item.bullets)
                            ? item.bullets
                                .map(
                                    bullet =>
                                        bullet.attribute
                                )
                                .filter(Boolean)
                            : []
                )
            )
        ];


    const bullets =
        [
            ...new Set(
                data.flatMap(
                    item =>
                        Array.isArray(item.bullets)
                            ? item.bullets
                                .map(
                                    bullet =>
                                        bullet.bulletType
                                )
                                .filter(Boolean)
                            : []
                )
            )
        ];


    createButtons(
        "typeButtons",
        types,
        toggleType
    );


    createButtons(
        "attributeButtons",
        attributes,
        toggleAttribute
    );


    createButtons(
        "bulletButtons",
        bullets,
        toggleBullet
    );

}


/* =========================================
   ボタン生成
========================================= */

function createButtons(
    areaId,
    values,
    callback
) {

    const area =
        document.getElementById(areaId);


    area.innerHTML = "";


    values.forEach(value => {

        const button =
            document.createElement("button");


        button.className =
            "filter-button";


        button.textContent =
            value;


        button.dataset.value =
            value;


        button.addEventListener(
            "click",
            () => {

                callback(
                    value,
                    button
                );

            }
        );


        area.appendChild(button);

    });

}


/* =========================================
   式
========================================= */

function toggleType(
    value,
    button
) {

    if (
        selectedTypes.includes(value)
    ) {

        selectedTypes =
            selectedTypes.filter(
                x => x !== value
            );


        button.classList.remove(
            "selected"
        );

    } else {

        selectedTypes.push(value);


        button.classList.add(
            "selected"
        );

    }


    updateSelectedInfo();

    search();

}


/* =========================================
   属性
========================================= */

function toggleAttribute(
    value,
    button
) {

    if (
        selectedAttributes.includes(value)
    ) {

        selectedAttributes =
            selectedAttributes.filter(
                x => x !== value
            );


        button.classList.remove(
            "selected"
        );

    } else {

        selectedAttributes.push(value);


        button.classList.add(
            "selected"
        );

    }


    updateSelectedInfo();

    search();

}


/* =========================================
   弾種
========================================= */

function toggleBullet(
    value,
    button
) {

    if (
        selectedBullets.includes(value)
    ) {

        selectedBullets =
            selectedBullets.filter(
                x => x !== value
            );


        button.classList.remove(
            "selected"
        );

    } else {

        selectedBullets.push(value);


        button.classList.add(
            "selected"
        );

    }


    updateSelectedInfo();

    search();

}


/* =========================================
   条件表示
========================================= */

function updateSelectedInfo() {

    const area =
        document.getElementById(
            "selectedInfo"
        );


    const conditions = [];


    if (selectedTypes.length) {

        conditions.push(
            "式：" +
            selectedTypes.join(" / ")
        );

    }


    if (selectedAttributes.length) {

        conditions.push(
            "属性：" +
            selectedAttributes.join(" / ")
        );

    }


    if (selectedBullets.length) {

        conditions.push(
            "弾種：" +
            selectedBullets.join(" / ")
        );

    }


    if (!conditions.length) {

        area.textContent =
            "条件を選択すると表示されます";

        return;

    }


    area.textContent =
        "選択中：" +
        conditions.join("　｜　");

}


/* =========================================
   条件判定
========================================= */

function checkCondition(
    selected,
    values
) {

    if (!selected.length) {

        return true;

    }


    if (searchMode === "AND") {

        return selected.every(
            value =>
                values.includes(value)
        );

    }


    return selected.some(
        value =>
            values.includes(value)
    );

}


/* =========================================
   検索
========================================= */

function search() {


    const keyword =
        document
            .getElementById("keyword")
            .value
            .trim()
            .toLowerCase();


    const results =
        data.filter(item => {


            /* =====================
               キーワード
            ===================== */

            const character =
                String(
                    item.character || ""
                ).toLowerCase();


            const spell =
                String(
                    item.spell || ""
                ).toLowerCase();


            const keywordOK =
                keyword === "" ||
                character.includes(keyword) ||
                spell.includes(keyword);


            if (!keywordOK) {

                return false;

            }


            /* =====================
               式
            ===================== */

            const itemTypes = [
                String(
                    item.type || ""
                )
            ];


            if (
                !checkCondition(
                    selectedTypes,
                    itemTypes
                )
            ) {

                return false;

            }


            /* =====================
               弾幕
            ===================== */

            const bullets =
                Array.isArray(item.bullets)
                    ? item.bullets
                    : [];


            /* 属性 */

            const itemAttributes =
                bullets
                    .map(
                        bullet =>
                            bullet.attribute
                    )
                    .filter(Boolean);


            if (
                !checkCondition(
                    selectedAttributes,
                    itemAttributes
                )
            ) {

                return false;

            }


            /* 弾種 */

            const itemBulletTypes =
                bullets
                    .map(
                        bullet =>
                            bullet.bulletType
                    )
                    .filter(Boolean);


            if (
                !checkCondition(
                    selectedBullets,
                    itemBulletTypes
                )
            ) {

                return false;

            }


            return true;

        });


    displayResults(results);

}


/* =========================================
   結果表示
========================================= */

function displayResults(results) {

    const area =
        document.getElementById(
            "results"
        );


    if (!results.length) {

        area.innerHTML = `

            <div class="no-result">

                該当するスペカ・ショットがありません。

            </div>

        `;

        return;

    }


    area.innerHTML = `

        <div class="result-count">

            ${results.length}件

        </div>

    `;


    results.forEach(item => {


        const div =
            document.createElement("div");


        div.className =
            "result";


        const bullets =
            Array.isArray(item.bullets)
                ? item.bullets
                : [];


        const attributes =
            [
                ...new Set(
                    bullets
                        .map(
                            bullet =>
                                bullet.attribute
                        )
                        .filter(Boolean)
                )
            ];


        const bulletTypes =
            [
                ...new Set(
                    bullets
                        .map(
                            bullet =>
                                bullet.bulletType
                        )
                        .filter(Boolean)
                )
            ];


        div.innerHTML = `

            <div class="character">

                ${escapeHTML(
                    item.character || ""
                )}

            </div>


            <div class="spell">

                ${escapeHTML(
                    item.spell || ""
                )}

            </div>


            <div class="type">

                ${escapeHTML(
                    item.type || ""
                )}

            </div>


            <div class="tags">


                ${
                    item.type
                    ?
                    `
                    <span class="tag type-tag">
                        式：${escapeHTML(item.type)}
                    </span>
                    `
                    :
                    ""
                }


                ${attributes.map(
                    attribute =>

                    `
                    <span class="tag attribute">
                        属性：${escapeHTML(attribute)}
                    </span>
                    `

                ).join("")}


                ${bulletTypes.map(
                    bullet =>

                    `
                    <span class="tag bullet">
                        ${escapeHTML(bullet)}
                    </span>
                    `

                ).join("")}


            </div>

        `;


        area.appendChild(div);

    });

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================
   キーワード
========================================= */

document
    .getElementById("keyword")
    .addEventListener(
        "input",
        search
    );


/* =========================================
   AND
========================================= */

document
    .getElementById("andButton")
    .addEventListener(
        "click",
        () => {

            searchMode = "AND";


            document
                .getElementById("andButton")
                .classList.add(
                    "selected"
                );


            document
                .getElementById("orButton")
                .classList.remove(
                    "selected"
                );


            search();

        }
    );


/* =========================================
   OR
========================================= */

document
    .getElementById("orButton")
    .addEventListener(
        "click",
        () => {

            searchMode = "OR";


            document
                .getElementById("orButton")
                .classList.add(
                    "selected"
                );


            document
                .getElementById("andButton")
                .classList.remove(
                    "selected"
                );


            search();

        }
    );


/* =========================================
   リセット
========================================= */

document
    .getElementById("resetButton")
    .addEventListener(
        "click",
        () => {


            selectedTypes = [];

            selectedAttributes = [];

            selectedBullets = [];


            document
                .querySelectorAll(
                    ".filter-button"
                )
                .forEach(button => {

                    button.classList.remove(
                        "selected"
                    );

                });


            document
                .getElementById("keyword")
                .value = "";


            updateSelectedInfo();

            search();

        }
    );


/* =========================================
   起動
========================================= */

loadData();

</script>

</body>
</html>
