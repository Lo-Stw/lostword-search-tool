<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>東方ロストワード 弾幕検索</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f3f4f6;
 color:#222;
 font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif
}
header{
 background:#242424;
 color:#fff;
 padding:20px 14px;
 text-align:center
}
header h1{margin:0;font-size:22px}
header p{margin:7px 0 0;font-size:13px;opacity:.8}

.container{max-width:900px;margin:auto;padding:10px}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{
 flex:1;padding:13px;border:0;border-radius:12px;
 background:#fff;font-weight:700
}
.tab.active{background:#333;color:#fff}

.box{
 background:#fff;border-radius:15px;padding:15px;
 margin-bottom:12px;box-shadow:0 2px 8px #00000012
}
.section{margin-bottom:16px}
.title{font-weight:700;font-size:15px;margin-bottom:8px}

.input,.select{
 width:100%;padding:10px;border:1px solid #ccc;
 border-radius:9px;font-size:15px;background:#fafafa
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.buttons{display:flex;flex-wrap:wrap;gap:6px}
.filter{
 padding:8px 11px;border:1px solid #ccc;
 border-radius:20px;background:#fff;font-size:13px
}
.filter.selected{
 background:#333;color:#fff;border-color:#333
}

.range{display:flex;gap:8px}
.range button{
 flex:1;padding:10px;border:1px solid #ccc;
 background:#fff;border-radius:8px
}
.range button.selected{background:#333;color:#fff}

.main{
 width:100%;padding:12px;border:0;border-radius:9px;
 background:#333;color:#fff;font-size:15px;font-weight:700
}
.sub{
 width:100%;padding:10px;border:0;border-radius:9px;
 background:#e7e7e7;margin-top:8px
}

.hidden{display:none}
.result-count{font-weight:700;margin:14px 0 8px}
.result{
 background:#fff;border-radius:13px;padding:14px;
 margin-bottom:10px;box-shadow:0 2px 6px #0000000d
}
.char{font-size:18px;font-weight:700}
.muted{color:#777;font-size:12px}
.tag{
 display:inline-block;padding:4px 7px;margin:3px 2px;
 border-radius:5px;font-size:11px;background:#eee
}
.attr{background:#fff1b8}
.bullet{background:#dceeff}

.attack{
 background:#f6f6f6;border-radius:10px;
 padding:10px;margin-top:10px
}
.attack h4{margin:0 0 5px}

.editor{
 background:#f6f6f6;border-radius:12px;
 padding:12px;margin-bottom:12px
}
.editor h3{margin:0 0 10px;font-size:16px}

.special-grid{
 display:grid;
 grid-template-columns:1fr;
 gap:7px
}
.special-row{
 background:#fff;
 border:1px solid #ddd;
 border-radius:9px;
 padding:9px
}
.special-head{
 display:flex;
 gap:6px;
 align-items:center
}
.special-head button{
 flex:1;padding:8px;
 border:1px solid #ccc;
 background:#fff;border-radius:8px
}
.special-head button.on{
 background:#333;color:#fff
}
.special-detail{
 display:none;
 margin-top:8px
}
.special-detail.show{display:block}

.ability{
 border:1px solid #ddd;
 border-radius:10px;
 padding:10px;
 margin-bottom:9px;
 background:#fafafa
}
.ability-title{
 font-weight:700;
 margin-bottom:8px
}
.mini{font-size:12px;color:#666;margin-bottom:5px}

.switch{display:flex;gap:6px}
.switch button{
 flex:1;padding:8px;
 border:1px solid #ccc;
 background:#fff;border-radius:8px
}
.switch button.on{
 background:#333;color:#fff
}

.msg{
 margin-top:10px;padding:10px;
 border-radius:8px;font-size:13px;
 white-space:pre-wrap
}
.ok{background:#e4f6e7}
.err{background:#ffe5e5}

.loading{text-align:center;padding:30px;color:#777}
.small{font-size:12px}

@media(max-width:600px){
 .row,.row3{grid-template-columns:1fr}
 .container{padding:8px}
}
</style>
</head>

<body>

<header>

<div class="container">

</div>

</div>

<!-- ステータス -->

<div class="box">

<div class="title">ステータス</div>

<div class="row3">

<input id="sPower" type="number" class="input" placeholder="総合つよさ">
<input id="sHp" type="number" class="input" placeholder="体力">
<input id="sSpeed" type="number" class="input" placeholder="速力">

<input id="sYangAtk" type="number" class="input" placeholder="陽攻">
<input id="sYinAtk" type="number" class="input" placeholder="陰攻">

<input id="sYinDef" type="number" class="input" placeholder="陰防">

</div>

</div>

<div class="box">

<div class="title">特殊スキル</div>

<div id="specialSkillEditor"></div>

</div>

<!-- ================= 能力 ================= -->

<div class="box">

<div class="title">能力</div>

<div id="abilityEditor"></div>

</div>

<!-- ================= 攻撃 ================= -->

<div class="box">

<div class="title">ショット・スペルカード</div>

<div id="attackEditors"></div>

</div>

<div class="box">

<button id="save" class="main">
☁️ Supabaseに保存
</button>

<div id="message"></div>

</div>

</section>

</div>

<script>

/* =========================================================
   Supabase
========================================================= */

const URL="https://tuzeswyyprzudnznalue.supabase.co";
const KEY="sb_publishable_Zt-pb9JvdQC9lOUTAM6x0Q_fTq1hU-W";
const TABLE="characters";

/* =========================================================
   基本データ
========================================================= */

const TYPES=[
"攻撃式","技巧式","速攻式","破壊式",
"防御式","支援式","回復式","妨害式"
];

const ATTR=[
"日","月","火","水","木","金","土","星"
];

const ABNORMAL=[
"毒霧","帯電","燃焼","凍結","暗闇"
];

const STATS=[
"陽攻","陰攻","陽防","陰防",
"CRI攻撃","CRI防御","CRI命中","CRI回避",
"速力","命中","回避"
];

const STAT_TYPES_SHORT=[
"速力","陽攻","陰攻","陽防","陰防"
];

const BULLETS=[
"通常弾","光弾","レーザー弾","質量弾",
"エネルギー弾","流体弾","尖弾","御札弾",
"斬撃弾","肉弾","ミサイル弾"
];

const RANGES=["全体","単体"];

const ATTACKS=[
["spread","拡散ショット"],
["focus","集中ショット"],
["spell1","スペルカード1"],
["spell2","スペルカード2"],
["lastWord","ラストワード"]
];

const SPECIALS=[
"硬質弾","斬裂弾","貫通弾","必中弾",
"鏡面弾","弾性弾","爆破弾","特効弾",
"粘着弾","衝撃弾","吸収弾","反動弾",
"焼却弾","氷解弾","放電弾","過毒弾","閃光弾"
];

/* 特殊スキル（1つ目のコードの全24種類を統合） */

const SPECIAL_SKILLS=[
"ファスト",
"チャージ",
"RANKⅡバフ",
"RANKⅡデバフ",
"畜力",
"蓄積",
"共鳴",
"X-Change",
"禁止解除",
"有利属性ダメージアップ",
"不利属性ダメージアップ",
"属性強化",
"弾強化",
"弱点付与",
"団結",
"バディコネクト",
"ゾーン",
"スキル再使用ターン数短縮",
"大結界",
"逆相",
"スペルゲージ遅延",
"全体耐性ダウン",
"持続",
"ダメージダウン"
];

let data=[];
let mode="AND";

const selected={
 type:[],
 attack:[],
 range:[],
 attr:[],
 bullet:[],
 special:[],
 char:[]
};

let statMode="";

/* =========================================================
   攻撃データ
========================================================= */

const attackData={};

ATTACKS.forEach(([key])=>{

 attackData[key]={
  name:"",
  range:"全体",
  attributes:[],
  bulletTypes:[],
  specials:{},

  hardRatio:"",
  sharpRatio:"",
  stickyRate:"",
  impactRate:"",
  absorbRatio:"",
  recoilRatio:""
 };

 SPECIALS.forEach(x=>{
  attackData[key].specials[x]=false;
 });

});

/* =========================================================
   特殊スキルデータ
========================================================= */

const specialData={};

SPECIAL_SKILLS.forEach(x=>{
 specialData[x]={
  enabled:false
 };
});

/* =========================================================
   能力データ
========================================================= */

const abilityData={

 conversion:{
  enabled:false,

  atkRank:false,
  atkAbnormal:[],

  defRank:false,
  defAbnormal:[],

  speedRank:false,
  speedAbnormal:[],

  spirit:false,
  spiritAbnormal:[],
  spiritValue:"",

  heal:false,
  healAbnormal:[],
  healValue:""
 },

 immunity:{
  effect:false,
  effectAbnormal:[],

  none:false,
  noneAbnormal:[],

  reflect:false,
  reflectAbnormal:[]
 },

 damageDown:{
  good:"",
  bad:""
 },

 damageUp:{
  good:"",
  bad:""
 },

 boost:{
  enabled:false,
  target:"自身",
  stat:""
 },

 graze:{
  enabled:false,
  target:"自身",
  stat:""
 }

};

/* =========================================================
   ユーティリティ
========================================================= */

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}

function chips(id,arr,sel,fn){

 const e=document.getElementById(id);

 if(!e)return;

 e.innerHTML="";

 arr.forEach(x=>{

  const b=document.createElement("button");

  b.className=
   "filter"+
   (sel.includes(x)?" selected":"");

  b.textContent=x;

  b.onclick=()=>fn(x,b);

  e.appendChild(b);

 });

}

function toggle(arr,x,b){

 const i=arr.indexOf(x);

 if(i>=0){

  arr.splice(i,1);
  b.classList.remove("selected");

 }else{

  arr.push(x);
  b.classList.add("selected");

 }

 search();

}

/* =========================================================
   検索フィルター
========================================================= */

function buildFilters(){

 chips(
  "fType",
  TYPES,
  selected.type,
  (x,b)=>toggle(selected.type,x,b)
 );

 chips(
  "fAttack",
  ATTACKS.map(x=>x[1]),
  selected.attack,
  (x,b)=>toggle(selected.attack,x,b)
 );

 chips(
  "fRange",
  RANGES,
  selected.range,
  (x,b)=>toggle(selected.range,x,b)
 );

 chips(
  "fAttr",
  ATTR,
  selected.attr,
  (x,b)=>toggle(selected.attr,x,b)
 );

 chips(
  "fBullet",
  BULLETS,
  selected.bullet,
  (x,b)=>toggle(selected.bullet,x,b)
 );

 chips(
  "fSpecial",
  SPECIALS,
  selected.special,
  (x,b)=>toggle(selected.special,x,b)
 );

 chips(
  "fChar",
  SPECIAL_SKILLS,
  selected.char,
  (x,b)=>toggle(selected.char,x,b)
);

}

/* =========================================================
   特殊スキルUI
========================================================= */

function initSpecialSkills(){

 const e=document.getElementById("specialSkillEditor");

 e.innerHTML="";

 SPECIAL_SKILLS.forEach(skill=>{

  const box=document.createElement("div");

  box.className="ability";

  box.innerHTML=`

   <div class="switch">
    <button
     type="button"
     id="ss-${skill}"
     class="${specialData[skill].enabled?"on":""}">
     ${skill}：
     ${specialData[skill].enabled?"あり":"なし"}
    </button>
   </div>

   <div
    id="sd-${skill}"
    class="${specialData[skill].enabled?"":"hidden"}"
    style="margin-top:8px">
   </div>
  `;

  e.appendChild(box);

  const btn=box.querySelector("button");
  const detail=box.querySelector(`#sd-${skill}`);

  btn.onclick=()=>{

   specialData[skill].enabled=
    !specialData[skill].enabled;

   btn.classList.toggle(
    "on",
    specialData[skill].enabled
   );

   btn.textContent=
    skill+"："+
    (specialData[skill].enabled?"あり":"なし");

   detail.classList.toggle(
    "hidden",
    !specialData[skill].enabled
   );

   buildSpecialDetail(skill,detail);

  };

  buildSpecialDetail(skill,detail);

 });

}

/* =========================================================
   特殊スキル詳細 (1つ目の構成を2つ目のUI方式に統合)
========================================================= */

function buildSpecialDetail(skill,e){

 if(!specialData[skill].enabled){
  e.innerHTML="";
  return;
 }

 const d=specialData[skill];

 switch(skill){

  case "RANKⅡバフ":
   e.innerHTML=`
    <select class="select" data-rank-stat>
     <option value="">バフ内容</option>
     ${STAT_TYPES_SHORT.map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="段階" data-rank-stage value="${esc(d.stage||"")}">
   `;
   break;

  case "RANKⅡデバフ":
   e.innerHTML=`
    <select class="select" data-rank-stat>
     <option value="">デバフ内容</option>
     ${STAT_TYPES_SHORT.map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="段階" data-rank-stage value="${esc(d.stage||"")}">
   `;
   break;

  case "畜力":
   e.innerHTML=`
    <select class="select" data-power-kind>
     <option value="">畜力種類</option>
     ${["体力畜力","結界畜力","霊力畜力"].map(x=>`<option ${d.kind===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="倍率 %" data-special-ratio value="${esc(d.ratio||"")}">
   `;
   break;

  case "蓄積":
   e.innerHTML=`
    <select class="select" data-accumulate-stat>
     <option value="">強化するもの</option>
     ${STAT_TYPES_SHORT.map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="倍率 %" data-special-ratio value="${esc(d.ratio||"")}">
   `;
   break;

  case "共鳴":
   const resType = d.stat || "ダメージ";
   e.innerHTML=`
    <select class="select" data-resonance-stat>
     <option value="">強化するもの</option>
     ${["ダメージ","CRIダメージ","霊力","攻撃時CRI率","速力"].map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="${resType==="霊力"?"数値":"倍率 %"}" data-special-value value="${esc(d.value||"")}">
   `;
   break;

  case "X-Change":
   e.innerHTML=`
    <input class="input" placeholder="効果" data-special-effect value="${esc(d.effect||"")}">
   `;
   break;

  case "有利属性ダメージアップ":
  case "不利属性ダメージアップ":
   e.innerHTML=`
    <input class="input" type="number" placeholder="倍率 %" data-special-ratio value="${esc(d.ratio||"")}">
   `;
   break;

  case "属性強化":
   e.innerHTML=`
    <select class="select" data-special-attr>
     <option value="">属性を選択</option>
     ${ATTR.map(x=>`<option ${d.attr===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="倍率 %" data-special-ratio value="${esc(d.ratio||"")}">
   `;
   break;

  case "弾強化":
   e.innerHTML=`
    <select class="select" data-special-bullet>
     <option value="">弾種を選択</option>
     ${BULLETS.map(x=>`<option ${d.bullet===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="倍率 %" data-special-ratio value="${esc(d.ratio||"")}">
   `;
   break;

  case "弱点付与":
   e.innerHTML=`
    <select class="select" data-special-attr>
     <option value="">弱点属性を選択</option>
     ${ATTR.map(x=>`<option ${d.attr===x?"selected":""}>${x}</option>`).join("")}
    </select>
   `;
   break;

  case "団結":
   e.innerHTML=`
    <select class="select" data-team-stat>
     <option value="">強化するもの</option>
     ${["霊力","攻撃時CRI率","CRIダメージ","速力","ダメージ"].map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="固定${d.stat==="霊力"?"値":"倍率 %"}" data-team-fixed value="${esc(d.fixed||"")}">
    <input class="input" style="margin-top:6px" type="number" placeholder="1人あたり${d.stat==="霊力"?"値":"倍率 %"}" data-team-per value="${esc(d.per||"")}">
   `;
   break;

  case "バディコネクト":
   e.innerHTML=`
    <select class="select" data-buddy-stat>
     <option value="">強化するもの</option>
     ${STAT_TYPES_SHORT.map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="倍率 %" data-special-ratio value="${esc(d.ratio||"")}">
   `;
   break;

  case "ゾーン":
   e.innerHTML=`
    <select class="select" data-zone-stat>
     <option value="">強化するもの</option>
     ${["CRIダメージ","攻撃時CRI率","ダメージ","速力"].map(x=>`<option ${d.stat===x?"selected":""}>${x}</option>`).join("")}
    </select>
    <input class="input" style="margin-top:6px" type="number" placeholder="固定倍率 %" data-zone-fixed value="${esc(d.fixed||"")}">
    <input class="input" style="margin-top:6px" type="number" placeholder="1人あたりの倍率 %" data-zone-per value="${esc(d.per||"")}">

function bindSpecialInputs(skill,e){

}

function saveSpecialField(skill,el,e){

 const d=specialData[skill];

 if(el.dataset.specialRatio!==undefined) d.ratio=el.value;
 if(el.dataset.specialAttr!==undefined) d.attr=el.value;
 if(el.dataset.specialBullet!==undefined) d.bullet=el.value;
 if(el.dataset.specialValue!==undefined) d.value=el.value;
 if(el.dataset.specialEffect!==undefined) d.effect=el.value;

 if(el.dataset.rankStat!==undefined) d.stat=el.value;
 if(el.dataset.rankStage!==undefined) d.stage=el.value;

 if(el.dataset.powerKind!==undefined) d.kind=el.value;
 if(el.dataset.accumulateStat!==undefined) d.stat=el.value;

 if(el.dataset.resonanceStat!==undefined) {
  d.stat=el.value;
  buildSpecialDetail(skill,e);
 }

 if(el.dataset.buddyStat!==undefined) d.stat=el.value;

 if(el.dataset.zoneStat!==undefined) d.stat=el.value;
 if(el.dataset.zoneFixed!==undefined) d.fixed=el.value;
 if(el.dataset.zonePer!==undefined) d.per=el.value;

 if(el.dataset.teamStat!==undefined) {
  d.stat=el.value;
  buildSpecialDetail(skill,e);
 }
 if(el.dataset.teamFixed!==undefined) d.fixed=el.value;
 if(el.dataset.teamPer!==undefined) d.per=el.value;

 if(el.dataset.duration!==undefined) d.duration=el.value;
 if(el.dataset.durationTarget!==undefined) d.target=el.value;
 if(el.dataset.durationEffect!==undefined) d.effect=el.value;
 if(el.dataset.durationValue!==undefined) d.value=el.value;

 if(el.dataset.bigUpStat!==undefined) d.upStat=el.value;
 if(el.dataset.bigUpRatio!==undefined) d.upRatio=el.value;
 if(el.dataset.bigDownStat!==undefined) d.downStat=el.value;
 if(el.dataset.bigDownRatio!==undefined) d.downRatio=el.value;
 if(el.dataset.breakEffect!==undefined) d.breakEffect=el.value;

 if(el.dataset.reverseUpStat!==undefined) d.upStat=el.value;
 if(el.dataset.reverseUpRatio!==undefined) d.upRatio=el.value;
 if(el.dataset.reverseDownStat!==undefined) d.downStat=el.value;
 if(el.dataset.reverseDownRatio!==undefined) d.downRatio=el.value;

 if(el.dataset.damageDownKind!==undefined) {
  d.kind=el.value;
  buildSpecialDetail(skill,e);
 }
 if(el.dataset.damageDownTarget!==undefined) d.target=el.value;

}

  placeholder="発動率 %";

  placeholder="倍率";

  };

 }

}

/* =========================================================
   検索
========================================================= */

function attackValues(c){
 return Object.values(c.attacks||{});
}

function matchSelected(sel,vals){

 if(!sel.length)return true;

 return mode==="AND"
  ?sel.every(x=>vals.includes(x))
  :sel.some(x=>vals.includes(x));

}

function hasSpecial(c,x){

 const d=c.details||{};
 const s=d.specialSkills||d.skills||{};

 return !!s[x]?.enabled;

}

function flatSpecials(c){

 const out=[];

 attackValues(c).forEach(a=>{

  Object.keys(a.specials||{})
  .forEach(k=>{

   if(a.specials[k])
    out.push(k);

  });

 });

 return [...new Set(out)];

}

function search(){

 const q=
  document.getElementById("q")
  .value.trim()
  .toLowerCase();

 const qs=
  document.getElementById("qSymbol")
  .value.trim()
  .toLowerCase();

 const stat=
  document.getElementById("statName").value;

 const sv=
  document.getElementById("statValue").value;

 const out=data.filter(c=>{

  if(q){

   const names=[
    c.character,
    ...attackValues(c).map(a=>a.name)
   ]
   .join(" ")
   .toLowerCase();

   if(!names.includes(q))
    return false;

  }

  if(
   qs &&
   !String(c.symbol||"")
   .toLowerCase()
   .includes(qs)
  )
   return false;

  if(!matchSelected(
   selected.type,
   [c.type]
  ))
   return false;

  if(selected.char.length){

   const vals=
    SPECIAL_SKILLS
    .filter(x=>hasSpecial(c,x));

   if(!matchSelected(
    selected.char,
    vals
   ))
    return false;

  }

  const at=attackValues(c);

  if(
   selected.attack.length||
   selected.range.length||
   selected.attr.length||
   selected.bullet.length||
   selected.special.length
  ){

   const ok=at.some(a=>{

    const idx=at.indexOf(a);

    const label=
     ATTACKS[idx]?.[1]||"";

    return(
     matchSelected(selected.attack,[label])&&
     matchSelected(selected.range,[a.range])&&
     matchSelected(selected.attr,a.attributes||[])&&
     matchSelected(selected.bullet,a.bulletTypes||[])&&
     matchSelected(
      selected.special,
      Object.keys(a.specials||{})
      .filter(x=>a.specials[x])
     )
    );

   });

   if(!ok)return false;

  }

  if(stat&&sv!==""){

   const v=
    Number((c.stats||{})[stat]);

   if(!Number.isFinite(v))
    return false;

   if(
    statMode==="min" &&
    v<Number(sv)
   )
    return false;

   if(
    statMode==="max" &&
    v>Number(sv)
   )
    return false;

  }

  return true;

 });

 renderResults(out);

}

/* =========================================================
   結果
========================================================= */

function renderResults(arr){

 const e=document.getElementById("results");

 if(!arr.length){

  e.innerHTML=
   '<div class="loading">該当するデータがありません。</div>';

  return;

 }

 e.innerHTML=
  `<div class="result-count">${arr.length}件</div>`;

 arr.forEach(c=>{

  let h=`
   <div class="result">

   <div class="char">
    ${esc(c.character)}
   </div>

   <div class="muted">
    汎異記号：
    ${esc(c.symbol||"未登録")}
    /
    ${esc(c.type||"")}
   </div>
  `;

  const s=c.stats||{};

  h+=`
   <div>
    ${
     Object.entries({
      総合つよさ:s.power,
      体力:s.hp,
      速力:s.speed,
      陽攻:s.yangAtk,
      陰攻:s.yinAtk,
      陽防:s.yangDef,
      陰防:s.yinDef
     })
     .filter(x=>x[1]!==undefined&&x[1]!="")
     .map(x=>`
      <span class="tag">
       ${x[0]}：${esc(x[1])}
      </span>
     `).join("")
    }
   </div>
  `;

  const details=c.details||{};
  const ss=details.specialSkills||details.skills||{};

  h+=`
   <div>
    ${
     SPECIAL_SKILLS
     .filter(x=>ss[x]?.enabled)
     .map(x=>`
      <span class="tag">${x}</span>
     `).join("")
    }
   </div>
  `;

  Object.entries(c.attacks||{})
  .forEach(([k,a])=>{

   const label=
    ATTACKS.find(x=>x[0]===k)?.[1]||k;

   if(!a.name)return;

   h+=`
    <div class="attack">

     <h4>
      ${label}
      <span class="tag">
       ${esc(a.range)}
      </span>
     </h4>

     <div>${esc(a.name)}</div>

     ${
      (a.attributes||[])
      .map(x=>`
       <span class="tag attr">
        属性：${esc(x)}
       </span>
      `).join("")
     }

     ${
      (a.bulletTypes||[])
      .map(x=>`
       <span class="tag bullet">
        ${esc(x)}
       </span>
      `).join("")
     }

     ${
      Object.keys(a.specials||{})
      .filter(x=>a.specials[x])
      .map(x=>`
       <span class="tag">
        ${x}
       </span>
      `).join("")
     }

    </div>
   `;

  });

  h+="</div>";

  e.insertAdjacentHTML(
   "beforeend",
   h
  );

 });

}

async function load(){

 try{

  const r=await fetch(
   `${URL}/rest/v1/${TABLE}?select=*`,
   {
    headers:{
     apikey:KEY,
     Authorization:"Bearer "+KEY
    }
   }
  );

  const t=await r.text();

  if(!r.ok)
   throw Error(t);

  data=JSON.parse(t);

  buildFilters();
  search();

 }catch(e){

  document.getElementById("results")
  .innerHTML=`
   <div class="result">

    <b>データ読み込みエラー</b>

    <br>

    <small>
     ${esc(e.message)}
    </small>

   </div>
  `;

 }

}

/* =========================================================
   保存
========================================================= */

function num(id){

 const v=
  document.getElementById(id).value;

 return v===""?null:Number(v);

}

async function save(){

 const msg=
  document.getElementById("message");

 const character=
  document.getElementById("aCharacter")
  .value.trim();

 const symbol=
  document.getElementById("aSymbol")
  .value.trim();

 const type=
  document.getElementById("aType")
  .value;

 if(!character||!type){

  msg.className="msg err";

  msg.textContent=
   "キャラクター名と式を入力してください。";

  return;

 }

 const stats={
  power:num("sPower"),
  hp:num("sHp"),
  speed:num("sSpeed"),
  yangAtk:num("sYangAtk"),
  yinAtk:num("sYinAtk"),
  yangDef:num("sYangDef"),
  yinDef:num("sYinDef")
 };

 const details={
  specialSkills:specialData,
  abilities:abilityData,
  stats
 };

 const record={
  character,
  symbol,
  type,
  attacks:attackData,
  details
 };

 msg.className="msg";
 msg.textContent="保存中……";

 try{

  const r=await fetch(
   `${URL}/rest/v1/${TABLE}`,
   {
    method:"POST",

    headers:{
     "Content-Type":"application/json",
     apikey:KEY,
     Authorization:"Bearer "+KEY,
     Prefer:"return=minimal"
    },

    body:JSON.stringify(record)
   }
  );

  const t=await r.text();

  if(!r.ok)
   throw Error(t);

  msg.className="msg ok";
  msg.textContent="保存しました！";

  await load();

 }catch(e){

  msg.className="msg err";

  msg.textContent=
   "保存失敗：\n"+e.message;

 }

}
