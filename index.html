<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>東方ロストワード 弾幕検索</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        sans-serif;
    background: #f3f4f6;
    color: #222;
}

header {
    background: #242424;
    color: white;
    padding: 20px 15px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 22px;
}

header p {
    margin: 7px 0 0;
    font-size: 13px;
    opacity: .75;
}

.container {
    max-width: 850px;
    margin: auto;
    padding: 10px;
}

.tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.tab {
    flex: 1;
    border: none;
    background: white;
    border-radius: 12px;
    padding: 13px 8px;
    font-size: 14px;
    font-weight: bold;
    color: #666;
}

.tab.active {
    background: #333;
    color: white;
}

.box {
    background: white;
    border-radius: 15px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.07);
}

.section {
    margin-bottom: 18px;
}

.title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 8px;
}

.input,
.select {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 9px;
    background: #fafafa;
    font-size: 16px;
}

.buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
}

.filter-button {
    border: 1px solid #ccc;
    background: white;
    border-radius: 20px;
    padding: 8px 12px;
    font-size: 13px;
}

.filter-button.selected {
    background: #333;
    color: white;
    border-color: #333;
}

.mode {
    display: flex;
    gap: 8px;
}

.mode button {
    flex: 1;
    padding: 10px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 8px;
}

.mode button.selected {
    background: #333;
    color: white;
}

.main-button,
.secondary-button,
.reset-button,
.danger-button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 9px;
    font-size: 15px;
    font-weight: bold;
}

.main-button {
    background: #333;
    color: white;
}

.secondary-button {
    background: #e8e8e8;
    color: #333;
}

.reset-button {
    background: #e5e5e5;
}

.danger-button {
    background: #ffe2e2;
    color: #a00000;
}

.result-count {
    font-weight: bold;
    margin: 15px 0 9px;
}

.result {
    background: white;
    border-radius: 13px;
    padding: 15px;
    margin-bottom: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,.06);
}

.character {
    font-size: 18px;
    font-weight: bold;
}

.symbol {
    color: #777;
    font-size: 13px;
    margin-top: 3px;
}

.type-tag {
    display: inline-block;
    background: #e8ddff;
    padding: 4px 7px;
    border-radius: 5px;
    font-size: 12px;
    margin-top: 7px;
}

.attack-card {
    margin-top: 12px;
    background: #f6f6f6;
    border-radius: 10px;
    padding: 10px;
}

.attack-name {
    font-weight: bold;
    font-size: 14px;
}

.range {
    display: inline-block;
    background: #ddd;
    border-radius: 5px;
    padding: 3px 6px;
    font-size: 11px;
    margin-left: 5px;
}

.spell-name {
    margin-top: 5px;
    font-size: 14px;
}

.tag {
    display: inline-block;
    padding: 4px 7px;
    margin: 3px 2px;
    border-radius: 5px;
    font-size: 12px;
}

.attribute {
    background: #fff1b8;
}

.bullet {
    background: #dceeff;
}

.attack-editor {
    background: #f5f5f5;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
}

.attack-editor-title {
    font-weight: bold;
    margin-bottom: 10px;
}

.bullet-editor {
    background: white;
    border-radius: 10px;
    padding: 10px;
    margin-top: 10px;
    border: 1px solid #ddd;
}

.bullet-title {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

.two-column {
    display: flex;
    gap: 8px;
}

.two-column > div {
    flex: 1;
}

.small-label {
    display: block;
    font-size: 12px;
    color: #666;
    margin-bottom: 5px;
}

.remove-button {
    border: none;
    background: #ddd;
    border-radius: 6px;
    padding: 5px 8px;
    font-size: 12px;
    float: right;
}

.message {
    margin-top: 12px;
    padding: 11px;
    border-radius: 9px;
    font-size: 13px;
}

.success {
    background: #e5f7e8;
    color: #216b2c;
}

.error {
    background: #ffe5e5;
    color: #8b2222;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #777;
}

.empty {
    text-align: center;
    padding: 30px;
    color: #777;
}

.hidden {
    display: none;
}

hr {
    border: 0;
    border-top: 1px solid #ddd;
    margin: 15px 0;
}

@media(max-width:480px) {
    .container {
        padding: 7px;
    }

    .box {
        padding: 13px;
    }

    .two-column {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<header>
    <h1>東方ロストワード</h1>
    <p>弾幕・スペカ検索ツール</p>
</header>

<div class="container">

    <div class="tabs">
        <button
            id="searchTab"
            class="tab active"
            onclick="showPage('search')"
        >
            🔍 検索
        </button>

        <button
            id="addTab"
            class="tab"
            onclick="showPage('add')"
        >
            ➕ キャラ追加
        </button>
    </div>


    <!-- =========================
         検索ページ
    ========================== -->

    <div id="searchPage">

        <div class="box">

            <div class="section">
                <div class="title">
                    キャラクター・汎異記号・スペカ検索
                </div>

                <input
                    id="keyword"
                    class="input"
                    placeholder="キャラ名・汎異記号・スペカ名"
                >
            </div>


            <div class="section">
                <div class="title">式</div>
                <div id="typeButtons" class="buttons"></div>
            </div>


            <div class="section">
                <div class="title">攻撃種</div>
                <div id="attackButtons" class="buttons"></div>
            </div>


            <div class="section">
                <div class="title">全体・単体</div>
                <div id="rangeButtons" class="buttons"></div>
            </div>


            <div class="section">
                <div class="title">属性</div>
                <div id="attributeButtons" class="buttons"></div>
            </div>


            <div class="section">
                <div class="title">弾種</div>
                <div id="bulletButtons" class="buttons"></div>
            </div>


            <div class="section">

                <div class="title">
                    複数条件の検索方法
                </div>

                <div class="mode">

                    <button
                        id="andButton"
                        class="selected"
                    >
                        AND
                    </button>

                    <button id="orButton">
                        OR
                    </button>

                </div>

            </div>


            <button
                id="resetButton"
                class="reset-button"
            >
                条件をリセット
            </button>

        </div>


        <div id="results">
            <div class="loading">
                データを読み込んでいます……
            </div>
        </div>

    </div>


    <!-- =========================
         キャラ追加ページ
    ========================== -->

    <div
        id="addPage"
        class="hidden"
    >

        <div class="box">

            <div class="section">

                <div class="title">
                    キャラクター名
                </div>

                <input
                    id="addCharacter"
                    class="input"
                    placeholder="例：霧雨魔理沙"
                >

            </div>


            <div class="section">

                <div class="title">
                    汎異記号
                </div>

                <input
                    id="addSymbol"
                    class="input"
                    placeholder="例：A6"
                >

            </div>


            <div class="section">

                <div class="title">
                    式
                </div>

                <select
                    id="addType"
                    class="select"
                >

                    <option value="">
                        式を選択してください
                    </option>

                    <option>攻撃式</option>
                    <option>技巧式</option>
                    <option>速攻式</option>
                    <option>破壊式</option>
                    <option>防御式</option>
                    <option>支援式</option>
                    <option>回復式</option>
                    <option>妨害式</option>

                </select>

            </div>

        </div>


        <div class="box">

            <div class="title">
                ショット・スペルカード
            </div>

            <div id="attackEditors"></div>

        </div>


        <div class="box">

            <button
                class="main-button"
                onclick="saveCharacter()"
            >
                ☁️ Supabaseに保存
            </button>

            <div id="addMessage"></div>

        </div>

    </div>

</div>


<script>

/* ==================================================
   Supabase設定
================================================== */

const SUPABASE_URL =
    "https://tuzeswyyprzudnznalue.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Zt-pb9JvdQC9lOUTAM6x0Q_fTq1hU-W";

const TABLE =
    "characters";


/* ==================================================
   固定設定
================================================== */

const attackDefinitions = [

    {
        key: "spread",
        label: "拡散ショット"
    },

    {
        key: "focus",
        label: "集中ショット"
    },

    {
        key: "spell1",
        label: "スペルカード1"
    },

    {
        key: "spell2",
        label: "スペルカード2"
    },

    {
        key: "lastWord",
        label: "ラストワード"
    }

];


const types = [
    "攻撃式",
    "技巧式",
    "速攻式",
    "破壊式",
    "防御式",
    "支援式",
    "回復式",
    "妨害式"
];


const ranges = [
    "全体",
    "単体"
];


const attributes = [
    "日",
    "月",
    "火",
    "水",
    "木",
    "金",
    "土",
    "星"
];


const bulletTypes = [
    "通常弾",
    "光弾",
    "レーザー弾",
    "質量弾",
    "エネルギー弾",
    "流体弾",
    "尖弾",
    "御札弾",
    "斬撃弾",
    "肉弾",
    "ミサイル弾"
];


/* ==================================================
   状態
================================================== */

let data = [];

let selectedTypes = [];
let selectedAttacks = [];
let selectedRanges = [];
let selectedAttributes = [];
let selectedBullets = [];

let searchMode = "AND";


/* ==================================================
   新規キャラ
================================================== */

function createEmptyAttacks() {

    const result = {};

    attackDefinitions.forEach(attack => {

        result[attack.key] = {

            name: attack.label,

            range:
                attack.key === "focus" ||
                attack.key === "spell2"
                    ? "単体"
                    : "全体",

            bullets: []

        };

    });

    return result;

}


let newAttacks =
    createEmptyAttacks();


/* ==================================================
   ページ切替
================================================== */

function showPage(page) {

    const searchPage =
        document.getElementById("searchPage");

    const addPage =
        document.getElementById("addPage");

    const searchTab =
        document.getElementById("searchTab");

    const addTab =
        document.getElementById("addTab");


    if(page === "search") {

        searchPage.classList.remove("hidden");
        addPage.classList.add("hidden");

        searchTab.classList.add("active");
        addTab.classList.remove("active");

        loadData();

    } else {

        searchPage.classList.add("hidden");
        addPage.classList.remove("hidden");

        searchTab.classList.remove("active");
        addTab.classList.add("active");

        renderAttackEditors();

    }

}


/* ==================================================
   Supabaseから取得
================================================== */

async function loadData() {

    const area =
        document.getElementById("results");


    area.innerHTML = `
        <div class="loading">
            データを読み込んでいます……
        </div>
    `;


    try {

        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE +
                "?select=*",
                {
                    method: "GET",

                    headers: {
                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY
                    }
                }
            );


        const text =
            await response.text();


        if(!response.ok) {

            throw new Error(
                text
            );

        }


        data =
            JSON.parse(text);


        createSearchButtons();

        search();


    } catch(error) {

        console.error(error);


        area.innerHTML = `

            <div class="result">

                <div class="character">
                    ⚠️ データ読み込みエラー
                </div>

                <br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* ==================================================
   検索ボタン生成
================================================== */

function createSearchButtons() {

    createButtons(
        "typeButtons",
        types,
        selectedTypes,
        toggleType
    );


    createButtons(
        "attackButtons",
        attackDefinitions.map(
            x => x.label
        ),
        selectedAttacks,
        toggleAttack
    );


    createButtons(
        "rangeButtons",
        ranges,
        selectedRanges,
        toggleRange
    );


    createButtons(
        "attributeButtons",
        attributes,
        selectedAttributes,
        toggleAttribute
    );


    createButtons(
        "bulletButtons",
        bulletTypes,
        selectedBullets,
        toggleBullet
    );

}


function createButtons(
    id,
    values,
    selected,
    callback
) {

    const area =
        document.getElementById(id);

    area.innerHTML = "";


    values.forEach(value => {

        const button =
            document.createElement("button");


        button.className =
            "filter-button";


        button.textContent =
            value;


        if(selected.includes(value)) {

            button.classList.add(
                "selected"
            );

        }


        button.onclick = () => {

            callback(
                value,
                button
            );

        };


        area.appendChild(button);

    });

}


/* ==================================================
   フィルター
================================================== */

function toggleType(value, button) {

    toggleArray(
        selectedTypes,
        value,
        button
    );

    search();

}


function toggleAttack(value, button) {

    toggleArray(
        selectedAttacks,
        value,
        button
    );

    search();

}


function toggleRange(value, button) {

    toggleArray(
        selectedRanges,
        value,
        button
    );

    search();

}


function toggleAttribute(value, button) {

    toggleArray(
        selectedAttributes,
        value,
        button
    );

    search();

}


function toggleBullet(value, button) {

    toggleArray(
        selectedBullets,
        value,
        button
    );

    search();

}


function toggleArray(
    array,
    value,
    button
) {

    const index =
        array.indexOf(value);


    if(index >= 0) {

        array.splice(index, 1);

        button.classList.remove(
            "selected"
        );

    } else {

        array.push(value);

        button.classList.add(
            "selected"
        );

    }

}


/* ==================================================
   条件判定
================================================== */

function matches(
    selected,
    values
) {

    if(selected.length === 0) {
        return true;
    }


    if(searchMode === "AND") {

        return selected.every(
            x => values.includes(x)
        );

    }


    return selected.some(
        x => values.includes(x)
    );

}


/* ==================================================
   検索
================================================== */

function search() {

    const keyword =
        document
            .getElementById("keyword")
            .value
            .trim()
            .toLowerCase();


    const results =
        data.filter(character => {

            const characterName =
                String(
                    character.character || ""
                ).toLowerCase();


            const symbol =
                String(
                    character.symbol || ""
                ).toLowerCase();


            const attacks =
                character.attacks || {};


            const spellNames =
                Object.values(attacks)
                    .map(
                        attack =>
                            attack.name || ""
                    )
                    .join(" ")
                    .toLowerCase();


            if(
                keyword &&
                !characterName.includes(keyword) &&
                !symbol.includes(keyword) &&
                !spellNames.includes(keyword)
            ) {

                return false;

            }


            if(
                !matches(
                    selectedTypes,
                    [character.type]
                )
            ) {

                return false;

            }


            const attackEntries =
                Object.entries(attacks);


            const matchingAttacks =
                attackEntries.filter(
                    ([key, attack]) => {

                        const definition =
                            attackDefinitions.find(
                                x =>
                                    x.key === key
                            );


                        if(!definition) {
                            return false;
                        }


                        const attackOK =
                            matches(
                                selectedAttacks,
                                [definition.label]
                            );


                        const rangeOK =
                            matches(
                                selectedRanges,
                                [attack.range]
                            );


                        const bullets =
                            attack.bullets || [];


                        const attributes =
                            bullets.map(
                                b =>
                                    b.attribute
                            );


                        const bulletKinds =
                            bullets.map(
                                b =>
                                    b.bulletType
                            );


                        const attributeOK =
                            matches(
                                selectedAttributes,
                                attributes
                            );


                        const bulletOK =
                            matches(
                                selectedBullets,
                                bulletKinds
                            );


                        return (
                            attackOK &&
                            rangeOK &&
                            attributeOK &&
                            bulletOK
                        );

                    }
                );


            const attackFilters =
                selectedAttacks.length ||
                selectedRanges.length ||
                selectedAttributes.length ||
                selectedBullets.length;


            if(
                attackFilters &&
                matchingAttacks.length === 0
            ) {

                return false;

            }


            return true;

        });


    displayResults(results);

}


/* ==================================================
   結果表示
================================================== */

function displayResults(results) {

    const area =
        document.getElementById("results");


    if(results.length === 0) {

        area.innerHTML = `
            <div class="empty">
                該当するデータがありません。
            </div>
        `;

        return;

    }


    area.innerHTML = `

        <div class="result-count">
            ${results.length}件
        </div>

    `;


    results.forEach(character => {

        const div =
            document.createElement("div");


        div.className =
            "result";


        let html = `

            <div class="character">
                ${escapeHTML(
                    character.character
                )}
            </div>

        `;


        if(character.symbol) {

            html += `

                <div class="symbol">
                    汎異記号：
                    ${escapeHTML(
                        character.symbol
                    )}
                </div>

            `;

        }


        html += `

            <span class="type-tag">
                ${escapeHTML(
                    character.type
                )}
            </span>

        `;

        Object.entries(
            character.attacks || {}
        ).forEach(
            ([key, attack]) => {

                if(
                    !attack ||
                    !attack.name
                ) {
                    return;
                }


                const definition =
                    attackDefinitions.find(
                        x =>
                            x.key === key
                    );


                if(!definition) {
                    return;
                }


                html += `

                    <div class="attack-card">

                        <div class="attack-name">

                            ${escapeHTML(
                                definition.label
                            )}

                            <span class="range">

                                ${escapeHTML(
                                    attack.range
                                )}

                            </span>

                        </div>

                        <div class="spell-name">

                            ${escapeHTML(
                                attack.name
                            )}

                        </div>

                `;


                (attack.bullets || [])
                    .forEach(bullet => {

                        html += `

                            <span class="tag attribute">

                                属性：
                                ${escapeHTML(
                                    bullet.attribute
                                )}

                            </span>

                            <span class="tag bullet">

                                ${escapeHTML(
                                    bullet.bulletType
                                )}

                            </span>

                            <span class="tag">

                                Boost
                                ${escapeHTML(
                                    bullet.boost
                                )}

                            </span>

                        `;

                    });


                html += `
                    </div>
                `;

            }
        );


        div.innerHTML =
            html;


        area.appendChild(div);

    });

}


/* ==================================================
   キャラ追加画面
================================================== */

function renderAttackEditors() {

    const area =
        document.getElementById(
            "attackEditors"
        );


    area.innerHTML = "";


    attackDefinitions.forEach(
        attack => {

            const item =
                newAttacks[
                    attack.key
                ];


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "attack-editor";


            card.innerHTML = `

                <div class="attack-editor-title">

                    ${attack.label}

                </div>


                <div class="section">

                    <label class="small-label">
                        名前
                    </label>

                    <input
                        class="input"
                        value="${escapeAttribute(
                            item.name
                        )}"
                        placeholder="${attack.label}"
                        oninput="
                            updateAttackName(
                                '${attack.key}',
                                this.value
                            )
                        "
                    >

                </div>


                <div class="section">

                    <label class="small-label">
                        全体・単体
                    </label>

                    <select
                        class="select"
                        onchange="
                            updateAttackRange(
                                '${attack.key}',
                                this.value
                            )
                        "
                    >

                        <option
                            value="全体"
                            ${
                                item.range === "全体"
                                ? "selected"
                                : ""
                            }
                        >
                            全体
                        </option>

                        <option
                            value="単体"
                            ${
                                item.range === "単体"
                                ? "selected"
                                : ""
                            }
                        >
                            単体
                        </option>

                    </select>

                </div>


                <div>

                    <label class="small-label">
                        弾幕
                    </label>

                    <div
                        id="bullets-${attack.key}"
                    ></div>

                    <button
                        class="secondary-button"
                        onclick="
                            addBullet(
                                '${attack.key}'
                            )
                        "
                    >
                        ＋ 弾幕を追加
                    </button>

                </div>

            `;


            area.appendChild(card);


            renderBullets(
                attack.key
            );

        }
    );

}


/* ==================================================
   攻撃名・範囲
================================================== */

function updateAttackName(
    key,
    value
) {

    newAttacks[key].name =
        value;

}


function updateAttackRange(
    key,
    value
) {

    newAttacks[key].range =
        value;

}


/* ==================================================
   弾幕
================================================== */

function addBullet(key) {

    newAttacks[key].bullets.push({

        boost: 0,

        attribute: "星",

        bulletType: "通常弾"

    });


    renderBullets(key);

}


function removeBullet(
    key,
    index
) {

    newAttacks[key]
        .bullets
        .splice(index, 1);


    renderBullets(key);

}


function updateBullet(
    key,
    index,
    property,
    value
) {

    newAttacks[key]
        .bullets[index][property] =
            property === "boost"
                ? Number(value)
                : value;

}


function renderBullets(key) {

    const area =
        document.getElementById(
            "bullets-" + key
        );


    if(!area) return;


    area.innerHTML = "";


    newAttacks[key]
        .bullets
        .forEach(
            (bullet, index) => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "bullet-editor";


                div.innerHTML = `

                    <div class="bullet-title">

                        弾幕 ${index + 1}

                        <button
                            class="remove-button"
                            onclick="
                                removeBullet(
                                    '${key}',
                                    ${index}
                                )
                            "
                        >
                            削除
                        </button>

                    </div>


                    <div class="two-column">

                        <div>

                            <label class="small-label">
                                ブースト
                            </label>

                            <select
                                class="select"
                                onchange="
                                    updateBullet(
                                        '${key}',
                                        ${index},
                                        'boost',
                                        this.value
                                    )
                                "
                            >

                                ${createOptions(
                                    [0,1,2,3,4,5],
                                    Number(
                                        bullet.boost
                                    )
                                )}

                            </select>

                        </div>


                        <div>

                            <label class="small-label">
                                属性
                            </label>

                            <select
                                class="select"
                                onchange="
                                    updateBullet(
                                        '${key}',
                                        ${index},
                                        'attribute',
                                        this.value
                                    )
                                "
                            >

                                ${createOptions(
                                    attributes,
                                    bullet.attribute
                                )}

                            </select>

                        </div>

                    </div>


                    <br>


                    <label class="small-label">
                        弾種
                    </label>

                    <select
                        class="select"
                        onchange="
                            updateBullet(
                                '${key}',
                                ${index},
                                'bulletType',
                                this.value
                            )
                        "
                    >

                        ${createOptions(
                            bulletTypes,
                            bullet.bulletType
                        )}

                    </select>

                `;


                area.appendChild(div);

            }
        );

}


/* ==================================================
   セレクト
================================================== */

function createOptions(
    values,
    selected
) {

    return values
        .map(value => `

            <option
                value="${escapeAttribute(value)}"
                ${
                    String(value) ===
                    String(selected)
                        ? "selected"
                        : ""
                }
            >
                ${escapeHTML(value)}
            </option>

        `)
        .join("");

}


/* ==================================================
   Supabaseに保存
================================================== */

async function saveCharacter() {

    const message =
        document.getElementById(
            "addMessage"
        );


    const character =
        document
            .getElementById(
                "addCharacter"
            )
            .value
            .trim();


    const symbol =
        document
            .getElementById(
                "addSymbol"
            )
            .value
            .trim();


    const type =
        document
            .getElementById(
                "addType"
            )
            .value;


    if(!character) {

        showMessage(
            message,
            "キャラクター名を入力してください。",
            false
        );

        return;

    }


    if(!type) {

        showMessage(
            message,
            "式を選択してください。",
            false
        );

        return;

    }


    const record = {

        character: character,

        symbol: symbol,

        type: type,

        attacks:
            JSON.parse(
                JSON.stringify(
                    newAttacks
                )
            )

    };


    try {

        showMessage(
            message,
            "保存しています……",
            true
        );


        const response =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/" +
                TABLE,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_KEY,

                        "Prefer":
                            "return=minimal"

                    },

                    body:
                        JSON.stringify(
                            record
                        )

                }
            );


        const text =
            await response.text();


        if(!response.ok) {

            throw new Error(
                text
            );

        }


        showMessage(
            message,
            "☁️ 保存しました！",
            true
        );


        document
            .getElementById(
                "addCharacter"
            )
            .value = "";


        document
            .getElementById(
                "addSymbol"
            )
            .value = "";


        document
            .getElementById(
                "addType"
            )
            .value = "";


        newAttacks =
            createEmptyAttacks();


        renderAttackEditors();


        await loadData();


    } catch(error) {

        console.error(error);


        showMessage(
            message,
            "保存に失敗しました：\n" +
            error.message,
            false
        );

    }

}


/* ==================================================
   メッセージ
================================================== */

function showMessage(
    element,
    text,
    success
) {

    element.innerHTML = `

        <div class="message ${
            success
                ? "success"
                : "error"
        }">

            ${escapeHTML(text)}

        </div>

    `;

}

/* ==================================================
   エスケープ
================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


function escapeAttribute(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/"/g, "&quot;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

}
